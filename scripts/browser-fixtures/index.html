<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cinder browser fixtures</title>
    <style>

      *::before,
      *::after {
        box-sizing: border-box;

    <script type="module" src="./src/main.ts"></script>
