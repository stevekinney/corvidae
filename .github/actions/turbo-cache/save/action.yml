# The save half of `../restore`, which names the key. Run it as the job's last step with
# `if: ${{ !cancelled() }}`. A cache already saved for this commit (a re-run of the same sha) is
# kept: the cache action skips the upload when the key exists.
name: Save the Turborepo cache
description: Save Turborepo's local task cache under the commit this job ran.

inputs:
  replay_name:
    description: Optional artifact name for a failed job's replay record.
    required: false
    default: ''
  prior_status:
    description: Job status before the cache save.
    required: false
    default: success
  replay_token:
    description: Token used only to identify the running replay job.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: cache
      if: ${{ !cancelled() }}
      continue-on-error: true
      with:
        path: .turbo/cache
        key: ${{ env.TURBO_CACHE_PREFIX }}${{ github.sha }}
    - name: Retain first-failure replay record
      id: replay
      if: ${{ always() && inputs.replay_name != '' && inputs.prior_status == 'success' && steps.cache.outcome == 'failure' }}
      shell: bash
      env:
        CI_REPLAY_TOKEN: ${{ inputs.replay_token }}
      run: |
        if command -v bun >/dev/null && [ -f scripts/chef/ci-replay.ts ]; then
          bun scripts/chef/ci-replay.ts finalize || { [ -f "$RUNNER_TEMP/ci-replay-record.json" ] || bash -c "$CI_REPLAY_FALLBACK"; }
        else
          bash -c "$CI_REPLAY_FALLBACK"
        fi
        bash -c "$CI_REPLAY_STAGE"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ always() && steps.replay.outcome == 'success' }}
      with:
        name: ${{ inputs.replay_name }}
        path: ${{ runner.temp }}/ci-replay-artifact
        if-no-files-found: error
    - name: Preserve cache save failure
      if: ${{ always() && steps.cache.outcome == 'failure' }}
      shell: bash
      run: exit 1
