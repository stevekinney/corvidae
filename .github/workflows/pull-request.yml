# Advisory checks for pull requests (COR-2369). Nothing here is a required status check; the jobs
# produce evidence for making CI the full tier. This is the quick tier, `bun run check`, split into
# jobs. The full tier runs from `main.yml`.
name: Pull request

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # `--affected` and the test selection compare against the pull request's base branch.
  TURBO_SCM_BASE: origin/${{ github.base_ref }}
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

jobs:
  static:
    name: Format and root checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun --version
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint:root
        if: ${{ !cancelled() }}
      - run: bun run typecheck:root
        if: ${{ !cancelled() }}

  workspaces:
    name: Affected workspaces lint and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun --version
      - run: bun install --frozen-lockfile
      # No Bun test worker starts here, so the test pool does not bound these tasks; the standard
      # runner has 4 vCPUs and 16 GB (public repositories). The root `turbo.json` caps at 34%, one
      # task here, for the shared 12-core development host.
      - run: bunx turbo run lint typecheck --continue --concurrency=4 # MEASUREMENT: drop --affected is reverted next push

  tests:
    name: Affected fast-lane tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Linux failures for follow-up (COR-2380): bureau's file-watch tests raced on a runner and are
    # fixed, but no run of a selection that reaches bureau has been seen green yet, and the isolated
    # lane reaches Bureau's integration test that fails on `main` (COR-2379). A failure of this job
    # is shown as failed but does not fail the run. Remove this line once such a run is green.
    continue-on-error: true
    env:
      TURBO_CONCURRENCY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun --version
      - run: bun install --frozen-lockfile
      # A change that reaches the root workspace runs `test:browser-fixtures`, which needs Chromium.
      - run: bunx playwright install --with-deps chromium
      # The Postgres suites start a disposable cluster with `initdb` and `pg_ctl` from PATH; the
      # runner image installs PostgreSQL but leaves its binaries off PATH (as in `main.yml`).
      - run: echo "$(ls -d /usr/lib/postgresql/*/bin | tail -1)" >> "$GITHUB_PATH"
      # `--isolated` adds the serial slow and integration lanes, narrowed to the selection: a
      # change that reaches no such test runs none, so a broken integration test fails before merge
      # at the cost of only the tests the change reaches. The `main` workflow's slow job runs them
      # all, but only after the merge.
      - run: bun scripts/affected-tests.ts run --isolated --base "$TURBO_SCM_BASE"
