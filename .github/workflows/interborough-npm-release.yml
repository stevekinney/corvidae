name: Interborough npm release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full Corvidae commit SHA to release.
        required: true
        type: string
      version:
        description: SemVer to build and publish.
        required: true
        type: string
      publish:
        description: Publish the tested tarball and verify the public registry install.
        required: true
        default: false
        type: boolean
  push:
    branches: [main]
    paths: [.github/workflows/interborough-npm-release.yml]

permissions:
  contents: read

jobs:
  package:
    name: Build and package macOS arm64 release
    runs-on: macos-15
    timeout-minutes: 90
    outputs:
      source_sha: ${{ steps.release-inputs.outputs.source_sha }}
      version: ${{ steps.release-inputs.outputs.version }}
    env:
      SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
      VERSION: ${{ inputs.version || '0.0.0-candidate.0' }}
      PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    steps:
      - name: Validate immutable inputs
        id: release-inputs
        run: |
          test "${#SOURCE_SHA}" = 40
          printf '%s' "$SOURCE_SHA" | grep -Eq '^[0-9a-fA-F]{40}$'
          case "$VERSION" in
            *$'\n'*|*$'\r'*)
              echo "Release version must be on one line." >&2
              exit 1
              ;;
          esac
          printf '%s' "$VERSION" | grep -Eq '^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          source_sha="$(printf '%s' "$SOURCE_SHA" | tr '[:upper:]' '[:lower:]')"
          if [ "$PUBLISH" = true ]; then
            test "$GITHUB_REF" = refs/heads/main
            test "$GITHUB_REF_PROTECTED" = true
            test "$source_sha" = "$GITHUB_SHA"
          fi
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release-inputs.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify checked out source
        env:
          SOURCE_SHA: ${{ steps.release-inputs.outputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v6.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - run: bunx playwright install chromium
      - name: Build one release archive
        working-directory: applications/interborough
        run: bun scripts/build-release.ts --version "$VERSION" --outdir "$RUNNER_TEMP/interborough-release"
      - name: Test release archive before npm packaging
        working-directory: applications/interborough
        env:
          CORVIDAE_EXPECTED_RELEASE_SHA: ${{ steps.release-inputs.outputs.source_sha }}
        run: |
          bun scripts/test-installed-release.ts \
            --archive "$RUNNER_TEMP/interborough-release/interborough-$VERSION-darwin-arm64.tar.gz" \
            --evidence "$RUNNER_TEMP/interborough-evidence/archive"
      - name: Pack macOS arm64 payload
        working-directory: applications/interborough
        run: |
          bun scripts/package-release.ts \
            --archive "$RUNNER_TEMP/interborough-release/interborough-$VERSION-darwin-arm64.tar.gz" \
            --outdir "$RUNNER_TEMP/interborough-package"
      - name: Test offline install on macOS arm64
        working-directory: applications/interborough
        env:
          CORVIDAE_EXPECTED_RELEASE_SHA: ${{ steps.release-inputs.outputs.source_sha }}
        run: |
          package_directory="$RUNNER_TEMP/interborough-package"
          prefix="$package_directory/prefix"
          npm install --global --offline --ignore-scripts --prefix "$prefix" "$package_directory/interborough-$VERSION.tgz"
          executable="$prefix/bin/interborough"
          test -x "$executable"
          test -f "$prefix/lib/node_modules/interborough/payload/share/interborough/plugin-runtime/node_modules/@lostgradient/interborough-plugin/package.json"
          test "$(env -i PATH=/usr/bin:/bin HOME="$prefix" INTERBOROUGH_HOME="$prefix" "$executable" --version)" = "$VERSION"
          bun scripts/test-installed-release.ts \
            --command "$executable" \
            --evidence "$RUNNER_TEMP/interborough-evidence/offline-install"
      - name: Upload installed release evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: interborough-installed-release-evidence
          path: ${{ runner.temp }}/interborough-evidence
          if-no-files-found: ignore
      - name: Upload tested package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: interborough-${{ steps.release-inputs.outputs.version }}-darwin-arm64-npm-package
          path: |
            ${{ runner.temp }}/interborough-package/*.tgz
            ${{ runner.temp }}/interborough-package/package-result.json
          if-no-files-found: error

  publish:
    name: Publish the tested npm tarball
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main' && github.ref_protected }}
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
    env:
      SOURCE_SHA: ${{ needs.package.outputs.source_sha }}
      VERSION: ${{ needs.package.outputs.version }}
    steps:
      - name: Verify tested source matches the dispatch
        run: test "$SOURCE_SHA" = "$GITHUB_SHA"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v6.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: interborough-${{ needs.package.outputs.version }}-darwin-arm64-npm-package
          path: ${{ runner.temp }}/interborough-package
      - name: Fail closed when the version exists
        run: |
          response="$RUNNER_TEMP/npm-version-check.json"
          diagnostics="$RUNNER_TEMP/npm-version-check.log"
          if npm view "interborough@$VERSION" version --json > "$response" 2> "$diagnostics"; then
            echo "interborough@$VERSION already exists" >&2
            exit 1
          fi
          if ! NPM_VERSION_RESPONSE="$response" node -e 'const result = JSON.parse(require("node:fs").readFileSync(process.env.NPM_VERSION_RESPONSE, "utf8")); if (result.error?.code !== "E404") process.exit(1);'; then
            cat "$diagnostics" >&2
            exit 1
          fi
      - name: Publish the tested tarball
        run: |
          package="$RUNNER_TEMP/interborough-package/interborough-$VERSION.tgz"
          NPM_TESTED_TARBALL="$package" NPM_PACKAGE_RECEIPT="$RUNNER_TEMP/interborough-package/package-result.json" \
            node -e '
              const { readFileSync } = require("node:fs");
              const { createHash } = require("node:crypto");
              const bytes = readFileSync(process.env.NPM_TESTED_TARBALL);
              const actual = "sha512-" + createHash("sha512").update(bytes).digest("base64");
              const { integrity } = JSON.parse(readFileSync(process.env.NPM_PACKAGE_RECEIPT, "utf8"));
              if (actual !== integrity) {
                console.error("Tested npm tarball integrity mismatch: expected %s, received %s", integrity, actual);
                process.exit(1);
              }
            '
          case "${VERSION%%+*}" in
            *-*) tag=next ;;
            *) tag=latest ;;
          esac
          npm publish "$package" --tag "$tag" --ignore-scripts --provenance --access public

  verify:
    name: Verify public npm tarball, provenance and anonymous install
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main' && github.ref_protected }}
    needs: [package, publish]
    runs-on: macos-15
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.package.outputs.version }}
      NODE_AUTH_TOKEN: ''
      NPM_TOKEN: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.package.outputs.source_sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v6.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - run: bunx playwright install chromium
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: interborough-${{ needs.package.outputs.version }}-darwin-arm64-npm-package
          path: ${{ runner.temp }}/interborough-package
      - name: Verify registry bytes and anonymous install
        run: |
          package_directory="$RUNNER_TEMP/interborough-package"
          mkdir -p "$RUNNER_TEMP/interborough-registry"
          cd "$RUNNER_TEMP/interborough-registry"
          npm view "interborough@$VERSION" dist --json > registry-dist.json
          NPM_PACKAGE_RECEIPT="$package_directory/package-result.json" \
            node -e 'const fs = require("node:fs"); const registry = JSON.parse(fs.readFileSync("registry-dist.json", "utf8")); const local = JSON.parse(fs.readFileSync(process.env.NPM_PACKAGE_RECEIPT, "utf8")); if (!registry.integrity || registry.integrity !== local.integrity || !registry.attestations) process.exit(1); console.log(registry.integrity);'
          npm pack "interborough@$VERSION" --ignore-scripts --json > registry-pack.json
          downloaded="$(node -e 'console.log(JSON.parse(require("node:fs").readFileSync("registry-pack.json", "utf8"))[0].filename)')"
          cmp "$package_directory/interborough-$VERSION.tgz" "$downloaded"
          npm install --global --ignore-scripts --prefix "$RUNNER_TEMP/interborough-fresh-prefix" "interborough@$VERSION"
          printf '{"private":true}\n' > package.json
          npm install --ignore-scripts --save-exact "interborough@$VERSION"
          npm audit signatures
      - name: Test anonymous global install
        working-directory: applications/interborough
        run: |
          bun scripts/test-installed-release.ts \
            --command "$RUNNER_TEMP/interborough-fresh-prefix/bin/interborough" \
            --evidence "$RUNNER_TEMP/interborough-registry-evidence"
      - name: Upload registry install evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: interborough-npm-registry-evidence
          path: |
            ${{ runner.temp }}/interborough-registry/registry-dist.json
            ${{ runner.temp }}/interborough-registry-evidence
          if-no-files-found: ignore
