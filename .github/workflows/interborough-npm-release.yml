name: Interborough npm release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full Corvidae commit SHA to release.
        required: true
        type: string
      version:
        description: SemVer to build and publish.
        required: true
        type: string
      publish:
        description: Publish the tested tarball and verify the public registry install.
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  release:
    name: Build and package macOS arm64 release
    runs-on: macos-15
    timeout-minutes: 90
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      VERSION: ${{ inputs.version }}
      PUBLISH: ${{ inputs.publish }}
      RELEASE_DIRECTORY: ${{ runner.temp }}/interborough-release
      PACKAGE_DIRECTORY: ${{ runner.temp }}/interborough-package
    steps:
      - name: Validate immutable inputs
        run: |
          test "${#SOURCE_SHA}" = 40
          printf '%s' "$SOURCE_SHA" | grep -Eq '^[0-9a-fA-F]{40}$'
          printf '%s' "$VERSION" | grep -Eq '^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify checked out source
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v6.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: Build one release archive
        working-directory: applications/interborough
        run: bun scripts/build-release.ts --version "$VERSION" --outdir "$RELEASE_DIRECTORY"
      - name: Test release archive before npm packaging
        working-directory: applications/interborough
        run: bun scripts/test-installed-release.ts --archive "$RELEASE_DIRECTORY/interborough-$VERSION-darwin-arm64.tar.gz"
      - name: Pack and test offline install
        working-directory: applications/interborough
        run: bun scripts/package-release.ts --archive "$RELEASE_DIRECTORY/interborough-$VERSION-darwin-arm64.tar.gz" --outdir "$PACKAGE_DIRECTORY"
      - name: Upload tested package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: interborough-$VERSION-darwin-arm64-npm-package
          path: ${{ runner.temp }}/interborough-package/*.tgz
          if-no-files-found: error
      - name: Fail closed when the version exists
        if: ${{ inputs.publish }}
        run: |
          if npm view "interborough@$VERSION" version --json > version.json 2> version.err; then
            echo "interborough@$VERSION already exists" >&2
            exit 1
          fi
          grep -q 'E404' version.err || { cat version.err >&2; exit 1; }
      - name: Publish the tested tarball
        if: ${{ inputs.publish }}
        run: npm publish "$PACKAGE_DIRECTORY/interborough-$VERSION.tgz" --provenance --access public
      - name: Verify registry bytes and anonymous install
        if: ${{ inputs.publish }}
        working-directory: applications/interborough
        run: |
          npm view "interborough@$VERSION" dist --json > "$PACKAGE_DIRECTORY/registry-dist.json"
          node -e 'const fs = require("node:fs"); const registry = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); const local = JSON.parse(fs.readFileSync(process.argv[2], "utf8")); if (!registry.integrity || registry.integrity !== local.integrity) process.exit(1);' "$PACKAGE_DIRECTORY/registry-dist.json" "$PACKAGE_DIRECTORY/package-result.json"
          npm pack "interborough@$VERSION" --json > "$PACKAGE_DIRECTORY/registry-pack.json"
          downloaded="$(node -e 'console.log(JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))[0].filename)' "$PACKAGE_DIRECTORY/registry-pack.json")"
          cmp "$PACKAGE_DIRECTORY/interborough-$VERSION.tgz" "$downloaded"
          npm install --global --ignore-scripts --prefix "$PACKAGE_DIRECTORY/fresh-prefix" "$downloaded"
          env -u NODE_AUTH_TOKEN -u NPM_TOKEN bun scripts/test-installed-release.ts --command "$PACKAGE_DIRECTORY/fresh-prefix/bin/interborough"
          npm audit signatures interborough@$VERSION
