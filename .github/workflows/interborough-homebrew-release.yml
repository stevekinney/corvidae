# Builds the immutable macOS arm64 archive that the public Homebrew formula pins. The release job
# can only publish the bytes that the macOS job tested, and only from protected `main`.
name: Interborough Homebrew release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full Corvidae commit SHA to release.
        required: true
        type: string
      version:
        description: SemVer to build into the archive and release tag.
        required: true
        type: string
      publish:
        description: Create the GitHub Release from the tested archive.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  package:
    name: Build and test macOS arm64 archive
    runs-on: macos-15
    timeout-minutes: 90
    outputs:
      source_sha: ${{ steps.release-inputs.outputs.source_sha }}
      tag: ${{ steps.release-inputs.outputs.tag }}
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      VERSION: ${{ inputs.version }}
      PUBLISH: ${{ inputs.publish }}
    steps:
      - name: Validate immutable inputs
        id: release-inputs
        run: |
          test "${#SOURCE_SHA}" = 40
          printf '%s' "$SOURCE_SHA" | grep -Eq '^[0-9a-fA-F]{40}$'
          printf '%s' "$VERSION" | grep -Eq '^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          source_sha="$(printf '%s' "$SOURCE_SHA" | tr '[:upper:]' '[:lower:]')"
          if [ "$PUBLISH" = true ]; then
            test "$GITHUB_REF" = refs/heads/main
            test "$GITHUB_REF_PROTECTED" = true
            test "$source_sha" = "$GITHUB_SHA"
          fi
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
          printf 'tag=v%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release-inputs.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify checked out source
        env:
          SOURCE_SHA: ${{ steps.release-inputs.outputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun --version
      - run: bun install --frozen-lockfile
      - name: Build one release archive
        working-directory: applications/interborough
        run: bun scripts/build-release.ts --version "$VERSION" --outdir "$RUNNER_TEMP/interborough-release"
      - name: Test the packaged archive before publication
        working-directory: applications/interborough
        env:
          CORVIDAE_EXPECTED_RELEASE_SHA: ${{ steps.release-inputs.outputs.source_sha }}
        run: |
          bun scripts/test-installed-release.ts \
            --archive "$RUNNER_TEMP/interborough-release/interborough-$VERSION-darwin-arm64.tar.gz" \
            --evidence "$RUNNER_TEMP/interborough-evidence/archive"
      - name: Write tested archive digest
        run: |
          cd "$RUNNER_TEMP/interborough-release"
          shasum -a 256 "interborough-$VERSION-darwin-arm64.tar.gz" > "interborough-$VERSION-darwin-arm64.tar.gz.sha256"
      - name: Upload tested release archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: interborough-${{ inputs.version }}-darwin-arm64-release
          path: |
            ${{ runner.temp }}/interborough-release/interborough-${{ inputs.version }}-darwin-arm64.tar.gz
            ${{ runner.temp }}/interborough-release/interborough-${{ inputs.version }}-darwin-arm64.tar.gz.sha256
          if-no-files-found: error
      - name: Upload installed release evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: interborough-homebrew-release-evidence
          path: ${{ runner.temp }}/interborough-evidence
          if-no-files-found: ignore

  release:
    name: Publish tested GitHub Release assets
    if: ${{ inputs.publish && github.ref == 'refs/heads/main' && github.ref_protected }}
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ needs.package.outputs.source_sha }}
      VERSION: ${{ inputs.version }}
      TAG: ${{ needs.package.outputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: interborough-${{ inputs.version }}-darwin-arm64-release
          path: ${{ runner.temp }}/interborough-release
      - name: Reject an existing release tag
        run: |
          response="$RUNNER_TEMP/interborough-existing-tag.json"
          diagnostics="$RUNNER_TEMP/interborough-existing-tag.log"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > "$response" 2> "$diagnostics"; then
            echo "Release tag $TAG already exists" >&2
            exit 1
          fi
          if ! grep -q '404' "$diagnostics"; then
            cat "$diagnostics" >&2
            exit 1
          fi
      - name: Verify downloaded archive digest
        run: |
          cd "$RUNNER_TEMP/interborough-release"
          shasum -a 256 -c "interborough-$VERSION-darwin-arm64.tar.gz.sha256"
      - name: Publish tested archive and checksum
        run: |
          cd "$RUNNER_TEMP/interborough-release"
          gh release create "$TAG" \
            "interborough-$VERSION-darwin-arm64.tar.gz" \
            "interborough-$VERSION-darwin-arm64.tar.gz.sha256" \
            --target "$SOURCE_SHA" \
            --title "Interborough $VERSION" \
            --generate-notes
