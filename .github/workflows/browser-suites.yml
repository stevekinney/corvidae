# The two Playwright browser suites (COR-2411), called by `main.yml` on every push to `main` and by
# `pull-request.yml` when a pull request's changes reach them. A failing case fails the job.
#
# The Chromium fixture suite (`scripts/browser-fixtures`) compares screenshots (`CINDER_VISUAL_DIFF=block`)
# against the committed Linux baselines, which reproduce only on the renderer that wrote them: native
# linux/arm64 in `mcr.microsoft.com/playwright:v<version>-jammy` (`scripts/browser-fixtures/visual-baselines.md`).
# So its shards run in that image on an arm64 runner, where Playwright's own Chromium and the image's
# fonts are the baseline renderer's; an x64 runner with `playwright install` rasterizes differently.
# `scripts/browser-fixtures/scripts/browser-suites-workflow.test.ts` keeps the image tag equal to the Playwright that `bun.lock`
# resolves. Interborough's end-to-end suite compares no screenshots, but its layout checks measure text,
# and Cinder's font stack is the system's: a bare runner's default sans (DejaVu Sans) is wider than the
# image's and cuts off text that fits on macOS (COR-2412). So it runs in the same image, on x64.
#
# Both shard jobs run through a Turborepo task (`//#ci:browser-fixtures`, `//#ci:browser-interborough`)
# whose hash holds the shard, the image tag and every file the suite reads, so a shard whose inputs
# did not change replays. The tasks call Playwright directly: the root `test:browser:*` scripts wrap
# it in the shared development host's lock and slot pool (`scripts/run-exclusively.ts`,
# `scripts/host-slots.ts`), which a runner does not need. The packages' own browser suites (COR-2080) run through `validate:batch` in the
# `packages` job, under the `fixtures` input, which their changes reach as well.
name: Browser suites

on:
  workflow_call:
    inputs:
      fixtures:
        description: Run the Chromium fixture suite.
        type: boolean
        required: true
      interborough:
        description: Run Interborough's end-to-end suite.
        type: boolean
        required: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'
  # Vercel Remote Cache, shared with the owner's machine; empty, remote caching is off.
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  fixtures:
    name: Chromium fixtures (${{ matrix.shard }}/4)
    if: ${{ inputs.fixtures }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-jammy
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CINDER_VISUAL_DIFF: block
      # The task's hash holds the shard and the image, so a shard replays only a run of the same
      # slice on the same renderer (`//#ci:browser-fixtures` in `turbo.json`).
      PLAYWRIGHT_BASE_IMAGE: mcr.microsoft.com/playwright:v1.63.0-jammy
      PLAYWRIGHT_SHARD: ${{ matrix.shard }}/4
    steps:
      # The image has neither Git (which `actions/checkout` needs for a repository rather than a
      # tarball) nor `unzip` (which `setup-bun` needs).
      - run: apt-get update && apt-get install -y --no-install-recommends git unzip
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun --version
      - run: bun install --frozen-lockfile
      - uses: ./.github/actions/turbo-cache/restore
        with:
          name: browser-fixtures-${{ matrix.shard }}
      # One Turborepo task (`//#ci:browser-fixtures`): it makes the component packages' derived
      # metadata first, then the manifest, then runs the shard; a run whose inputs did not change
      # replays the result and restores the reports below.
      # Four workers on the four processors the renderer container gets locally (`CONTAINER_CPUS`).
      # A shard takes whole files, and one file holds about half the cases, so its shard runs about
      # 31 minutes while another gets no file. `--fully-parallel` balances them but breaks
      # `overview-pairs-featured-preview-and-code.playwright.ts`, whose cases share a server.
      # The root script `ci:browser-fixtures` takes the reports' paths from the container's working
      # directory, since inside a container `github.workspace` names the host's path.
      - run: bunx turbo run //#ci:browser-fixtures
      # A failed report upload must not fail the suite's job.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        continue-on-error: true
        with:
          name: playwright-fixtures-${{ matrix.shard }}
          path: |
            playwright-output/
            scripts/browser-fixtures/test-results/
          retention-days: 14
          if-no-files-found: ignore
      - uses: ./.github/actions/turbo-cache/save
        if: ${{ !cancelled() }}

  # The packages' own browser suites (COR-2080): the cached `test:browser` task of every package
  # `turbo.json` gives one (chat, editor and terminal, moved out of the fixture suite above), which
  # `validate:batch` runs.
  # Same image, architecture and block mode as the fixture shards, since the terminal suite compares
  # the baselines moved with it. A second, filtered run must come from the cache.
  packages:
    name: Package browser suites
    if: ${{ inputs.fixtures }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-jammy
    env:
      CINDER_VISUAL_DIFF: block
    steps:
      # The image has neither Git (which `actions/checkout` needs for a repository rather than a
      # tarball) nor `unzip` (which `setup-bun` needs).
      - run: apt-get update && apt-get install -y --no-install-recommends git unzip
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun --version
      - run: bun install --frozen-lockfile
      - uses: ./.github/actions/turbo-cache/restore
        with:
          name: browser-packages
      - run: bun run validate:batch
      - run: >-
          bunx turbo run test:browser --filter=@lostgradient/terminal --dry=json
          | bun -e 'const run = JSON.parse(await Bun.stdin.text()); const task = run.tasks.find((entry) => entry.taskId === "@lostgradient/terminal#test:browser"); console.log(`terminal test:browser cache: ${task?.cache?.status}`); if (task?.cache?.status !== "HIT") process.exit(1);'
      - run: bunx turbo run test:browser --filter=@lostgradient/terminal
      # A failed report upload must not fail the suite's job.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        continue-on-error: true
        with:
          name: playwright-packages
          path: |
            components/*/browser/test-results/
            components/*/browser/playwright-report/
          retention-days: 14
          if-no-files-found: ignore
      - uses: ./.github/actions/turbo-cache/save
        if: ${{ !cancelled() }}

  interborough:
    name: Interborough end-to-end (${{ matrix.shard }}/4)
    if: ${{ inputs.interborough }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The image ships the Chromium the lockfile's Playwright launches, so there is no browser install.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-jammy
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # COR-2592 pilot: a trusted pull-request head and its bound full validation may share shard 1.
    # GitHub's `queue: max` retains every waiting consumer FIFO; the default single pending slot
    # would replace a waiting consumer when another eligible job arrives. A caller may still cancel
    # its deliberately superseded parent: that canceled job produces no result, while every still-
    # valid matching consumer keeps its place and runs this normal Turbo command after a canceled
    # producer. Every other event and shard has an isolated group, so this does not serialize
    # unrelated browser work or manufacture a synthetic result for a consumer.
    concurrency:
      group: >-
        ${{ matrix.shard == 1 && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && format('browser-interborough-{0}-{1}-{2}-{3}', github.event.pull_request.head.sha, github.event.pull_request.base.sha, matrix.shard, 'mcr.microsoft.com/playwright:v1.63.0-jammy') || matrix.shard == 1 && github.event_name == 'workflow_dispatch' && github.event.inputs.verification_request != '' && github.event.inputs.verification_plan != '' && github.event.inputs.verification_base != '' && format('browser-interborough-{0}-{1}-{2}-{3}', github.sha, github.event.inputs.verification_base, matrix.shard, 'mcr.microsoft.com/playwright:v1.63.0-jammy') || format('browser-interborough-isolated-{0}-{1}', github.run_id, matrix.shard) }}
      cancel-in-progress: false
      queue: max
    env:
      # The task's hash holds the shard and the image (`//#ci:browser-interborough` in `turbo.json`).
      PLAYWRIGHT_BASE_IMAGE: mcr.microsoft.com/playwright:v1.63.0-jammy
      PLAYWRIGHT_SHARD: ${{ matrix.shard }}/4
    steps:
      # The image has neither Git (which `actions/checkout` needs for a repository rather than a
      # tarball) nor `unzip` (which `setup-bun` needs).
      - run: apt-get update && apt-get install -y --no-install-recommends git unzip
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun --version
      - run: bun install --frozen-lockfile
      - uses: ./.github/actions/turbo-cache/restore
        with:
          name: browser-interborough-${{ matrix.shard }}
      # The root script `ci:browser-interborough` runs the gated runner, which picks a free block
      # of ports and never reuses a server; it passes every argument on to `playwright test`.
      # Stream grouped task output so a job timeout still exposes the active Playwright stage.
      - run: bunx turbo run //#ci:browser-interborough --log-order=stream
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        continue-on-error: true
        with:
          name: playwright-interborough-${{ matrix.shard }}
          path: |
            playwright-output/
            applications/interborough/test-results/
          retention-days: 14
          if-no-files-found: ignore
      - uses: ./.github/actions/turbo-cache/save
        if: ${{ !cancelled() }}
