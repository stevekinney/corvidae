# The Playwright browser suites (COR-2411), called by `main.yml` on every push to `main` and by
# `pull-request.yml` when a pull request's changes reach them. A failing case fails the job.
#
# The component packages' browser suites (COR-2080, COR-2092: each package's `browser/`, run by its
# cached `test:browser` task) compare screenshots (`CINDER_VISUAL_DIFF=block`) against the committed
# Linux baselines, which reproduce only on the renderer that wrote them: native linux/arm64 in
# `mcr.microsoft.com/playwright:v<version>-jammy` (`testing/testing/visual-baselines/visual-baselines.md`).
# So their shards run in that image on an arm64 runner, where Playwright's own Chromium and the image's
# fonts are the baseline renderer's; an x64 runner with `playwright install` rasterizes differently.
# `testing/testing/visual-baselines/browser-suites-workflow.test.ts` keeps the image tag equal to the
# Playwright that `bun.lock` resolves. Interborough's end-to-end suite compares no screenshots, but its
# layout checks measure text, and Cinder's font stack is the system's: a bare runner's default sans
# (DejaVu Sans) is wider than the image's and cuts off text that fits on macOS (COR-2412). So it runs
# in the same image, on x64.
#
# A shard runs its packages' `test:browser` tasks one at a time (each takes four workers);
# `scripts/browser-suite-shards.ts` deals the packages by weight. Interborough's job calls its gated
# runner directly: the root `e2e:interborough` script wraps it in the shared development host's
# lock (`scripts/run-exclusively.ts`), which a runner does not need.
name: Browser suites

on:
  workflow_call:
    inputs:
      fixtures:
        description: Run the component packages' Chromium browser suites.
        type: boolean
        required: true
      interborough:
        description: Run Interborough's end-to-end suite.
        type: boolean
        required: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

jobs:
  fixtures:
    name: Package browser suites (${{ matrix.shard }}/6)
    if: ${{ inputs.fixtures }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-jammy
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      CINDER_VISUAL_DIFF: block
    steps:
      # The image has neither Git (which `actions/checkout` needs for a repository rather than a
      # tarball) nor `unzip` (which `setup-bun` needs).
      - run: apt-get update && apt-get install -y --no-install-recommends git unzip
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun --version
      - run: bun install --frozen-lockfile
      # The shard's packages, one at a time, every one even after a failure.
      - run: >-
          bunx turbo run test:browser --continue --concurrency=1
          $(bun scripts/browser-suite-shards.ts ${{ matrix.shard }}/6)
          -- --reporter=line
      # A failed report upload must not fail the suite's job.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        continue-on-error: true
        with:
          name: playwright-packages-${{ matrix.shard }}
          path: |
            components/*/browser/test-results/
          retention-days: 14
          if-no-files-found: ignore

  interborough:
    name: Interborough end-to-end (${{ matrix.shard }}/4)
    if: ${{ inputs.interborough }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The image ships the Chromium the lockfile's Playwright launches, so there is no browser install.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-jammy
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      # The image has neither Git (which `actions/checkout` needs for a repository rather than a
      # tarball) nor `unzip` (which `setup-bun` needs).
      - run: apt-get update && apt-get install -y --no-install-recommends git unzip
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun --version
      - run: bun install --frozen-lockfile
      # The gated runner picks a free block of ports and never reuses a server; it passes every
      # argument on to `playwright test`.
      - run: >-
          PLAYWRIGHT_HTML_OUTPUT_DIR="$GITHUB_WORKSPACE/playwright-output/report"
          PLAYWRIGHT_JSON_OUTPUT_FILE="$GITHUB_WORKSPACE/playwright-output/results.json"
          bun applications/interborough/scripts/run-gated-browser-suite.ts
          --shard=${{ matrix.shard }}/4 --trace=retain-on-failure --reporter=line,html,json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        continue-on-error: true
        with:
          name: playwright-interborough-${{ matrix.shard }}
          path: |
            playwright-output/
            applications/interborough/test-results/
          retention-days: 14
          if-no-files-found: ignore
