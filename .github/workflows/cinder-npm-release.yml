name: Cinder npm release

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to release.
        type: choice
        options:
          - markdown
          - cinder
          - editor
          - cinder-mcp
        required: true
      version:
        description: Version to pack or publish, without build metadata.
        type: string
        required: true
      markdown-version:
        description: Published Markdown dependency version for Cinder and Editor.
        type: string
      cinder-version:
        description: Published Cinder dependency version for Editor and Cinder MCP.
        type: string
      publish:
        description: Publish the tested tarball from protected main.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cinder-npm-${{ inputs.package }}
  cancel-in-progress: false

env:
  PACKAGE: ${{ inputs.package }}
  VERSION: ${{ inputs.version }}

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MARKDOWN_VERSION: ${{ inputs.markdown-version }}
      CINDER_VERSION: ${{ inputs.cinder-version }}
    steps:
      - name: Validate release inputs
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          case "$PACKAGE" in
            markdown|cinder|editor|cinder-mcp) ;;
            *) exit 1 ;;
          esac
          if [[ "$VERSION" == *+* ]]; then
            echo '::error::Use a version without SemVer build metadata. npm removes it when publishing.'
            exit 1
          fi
          if [[ "$PACKAGE" == cinder || "$PACKAGE" == editor ]] && [[ -z "$MARKDOWN_VERSION" ]]; then
            echo '::error::Set markdown-version to the published Markdown version.'
            exit 1
          fi
          if [[ "$PACKAGE" == editor || "$PACKAGE" == cinder-mcp ]] && [[ -z "$CINDER_VERSION" ]]; then
            echo '::error::Set cinder-version to the published Cinder version.'
            exit 1
          fi
          if [ "$PUBLISH" = true ]; then
            test "$GITHUB_REF" = refs/heads/main
            test "$GITHUB_REF_PROTECTED" = true
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v6.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - name: Pack and verify
        run: |
          output="$RUNNER_TEMP/cinder-npm-package"
          mkdir "$output"
          case "$PACKAGE" in
            markdown)
              bun packages/markdown/scripts/pack-release.ts --version "$VERSION" --outdir "$output" > "$output/receipt.json"
              ;;
            cinder|editor)
              bunx turbo run types metadata --filter="@lostgradient/$PACKAGE" --concurrency=1
              bun scripts/pack-cinder-release.ts --package "$PACKAGE" --version "$VERSION" --markdown-version "$MARKDOWN_VERSION" --cinder-version "$CINDER_VERSION" --outdir "$output" > "$output/receipt.json"
              ;;
            cinder-mcp)
              bun packages/cinder-mcp/scripts/pack-release.ts --version "$VERSION" --cinder-version "$CINDER_VERSION" --outdir "$output" > "$output/receipt.json"
              ;;
          esac
          tarball="$output/lostgradient-$PACKAGE-$VERSION.tgz"
          bunx publint run --strict "$tarball"
          bunx attw --profile esm-only "$tarball"
          bun scripts/verify-cinder-release.ts "$PACKAGE" "$tarball"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cinder-npm-tarball
          path: ${{ runner.temp }}/cinder-npm-package
          if-no-files-found: error

  publish:
    if: ${{ inputs.publish && github.ref == 'refs/heads/main' && github.ref_protected }}
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v6.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cinder-npm-tarball
          path: ${{ runner.temp }}/cinder-npm-package
      - name: Verify tarball and publish using npm trusted publishing
        working-directory: ${{ runner.temp }}/cinder-npm-package
        run: |
          tarball="lostgradient-$PACKAGE-$VERSION.tgz"
          local_integrity="$(jq -er --arg name "@lostgradient/$PACKAGE" --arg version "$VERSION" --arg tarball "$tarball" '.[0] | select(.name == $name and .version == $version and .filename == $tarball) | .integrity' receipt.json)"
          actual_integrity="sha512-$(openssl dgst -sha512 -binary "$tarball" | openssl base64 -A)"
          test "$local_integrity" = "$actual_integrity"
          case "$VERSION" in
            *-*) tag=next ;;
            *) tag=latest ;;
          esac
          npm publish "$tarball" --ignore-scripts --provenance --access public --tag "$tag"

  verify:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v6.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cinder-npm-tarball
          path: ${{ runner.temp }}/cinder-npm-package
      - name: Verify public bytes, provenance and install
        working-directory: ${{ runner.temp }}/cinder-npm-package
        env:
          NPM_TOKEN: ''
          NODE_AUTH_TOKEN: ''
          NPM_CONFIG_USERCONFIG: /dev/null
        run: |
          package="@lostgradient/$PACKAGE@$VERSION"
          local_integrity="$(jq -er '.[0].integrity' receipt.json)"
          npm view "$package" dist --json > registry-dist.json
          test "$local_integrity" = "$(jq -er '.integrity' registry-dist.json)"
          jq -e '.attestations.provenance' registry-dist.json > /dev/null
          mkdir "$RUNNER_TEMP/registry-consumer"
          cd "$RUNNER_TEMP/registry-consumer"
          printf '{"private":true,"type":"module"}\n' > package.json
          npm install --ignore-scripts --no-audit --no-fund --save-exact "$package"
          npm audit signatures
          node --input-type=module -e 'await import("@lostgradient/" + process.env.PACKAGE);'
