# Advisory full suite on every push to `main` (COR-2369): every stage of `bun run validate`,
# split into jobs so no job's peak memory passes the 16 GB standard runner (Cinder's suite peaked
# at 7.8 GB under coverage on a laptop, so it still runs alone). Nothing here is a required status
# check. Coverage (`bun run coverage`) and the publish-surface sweep (`bun run release:check`) are
# not part of `validate` and not run here.
# Playwright browser suites (`bun run test:browser:chromium`) are not run; see the pull request
# that added this file.
name: Main

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

# One group for every push: a running run finishes, and a newer pending run replaces the older pending one.
concurrency:
  group: main
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

jobs:
  root:
    name: Root checks, scripts tests, audit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun --version
      - run: bun install --frozen-lockfile
      - run: bun run lint:root
      - run: bun run typecheck:root
        if: ${{ !cancelled() }}
      - run: bun run test:self
        if: ${{ !cancelled() }}
      - run: bunx playwright install --with-deps chromium
        if: ${{ !cancelled() }}
      - run: bun run test:browser-fixtures
        if: ${{ !cancelled() }}
      - run: bun run format:check
        if: ${{ !cancelled() }}
      - run: bun run audit
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: junit-root
          path: |
            **/test-output/junit/*.xml
            !**/node_modules/**
          if-no-files-found: ignore

  workspaces:
    name: Workspace lint and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun --version
      - run: bun install --frozen-lockfile
      # Lint and type-check start no Bun test worker, so the test pool does not bound them; the
      # standard runner has 4 vCPUs and 16 GB (public repositories), so four tasks at a time. The
      # root `turbo.json` caps at 34%, which is one task here and is meant for the shared 12-core
      # development host.
      - run: bunx turbo run lint typecheck --continue --concurrency=4

  tests:
    name: Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Cinder's suite peaked at 7.8 GB under coverage on a laptop, so it runs alone.
          - name: cinder
            filter: --filter=@lostgradient/cinder
          - name: components
            filter: --filter=./components/* --filter=!@lostgradient/cinder
          - name: packages
            filter: --filter=./packages/* --filter=!@lostgradient/weft --filter=!@lostgradient/bureau
          - name: applications, plugins, testing
            filter: --filter=./applications/* --filter=./plugins/* --filter=./testing/*
          - name: bureau
            filter: --filter=@lostgradient/bureau
          # This shard ran Weft's coverage run until COR-2370 and now runs its `test` task. It stays
          # advisory because two heartbeat tests fail on `main` on macOS too ("clears a cancelled
          # attempt's automatic heartbeat interval while its activity ignores the signal" in
          # worker/long-poll.test.ts and worker/index.server-messages.test.ts); COR-2380 owns the
          # Linux failures only, so the flag goes when `main` is green there.
          - name: weft
            filter: --filter=@lostgradient/weft
            advisory: true
          # Catch-all: it only excludes what the shards above select (including bureau and weft,
          # which live under packages/), so a new top-level workspace folder lands here rather
          # than in no shard.
          - name: everything else
            filter: --filter=!./components/* --filter=!./packages/* --filter=!./applications/* --filter=!./plugins/* --filter=!./testing/*
    continue-on-error: ${{ matrix.advisory == true }}
    env:
      # One task at a time: a task runs up to four Bun workers on a 4 vCPU runner.
      TURBO_CONCURRENCY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun --version
      - run: bun install --frozen-lockfile
      # The Postgres suites start a disposable cluster with `initdb` and `pg_ctl` from PATH; the
      # runner image installs PostgreSQL but leaves its binaries off PATH.
      - run: echo "$(ls -d /usr/lib/postgresql/*/bin | tail -1)" >> "$GITHUB_PATH"
      # The `test` task `bun run validate` runs for every workspace, not a coverage run.
      - run: bunx turbo run test --continue ${{ matrix.filter }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: junit-tests-${{ strategy.job-index }}
          path: |
            **/test-output/junit/*.xml
            !**/node_modules/**
          if-no-files-found: ignore

  tests-slow:
    name: Slow and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun --version
      - run: bun install --frozen-lockfile
      - run: echo "$(ls -d /usr/lib/postgresql/*/bin | tail -1)" >> "$GITHUB_PATH"
      # Bureau's event-history-run-ownership-recovery-lmdb integration test fails on `main` itself
      # (COR-2379); it is not marked advisory here.
      - run: bun run test:slow --continue --filter=!@lostgradient/ventriloquist
      - run: bunx turbo run test:slow --concurrency=1 --filter=@lostgradient/ventriloquist
        if: ${{ !cancelled() }}

  # `check-test-durations` reads every workspace's JUnit report from the working tree, and each
  # shard above runs on its own runner, so the shards upload their reports and this job gathers
  # them. A shard that failed before it wrote a report makes this job fail with the workspace named.
  test-durations:
    name: Test durations
    needs: [root, tests]
    if: ${{ !cancelled() }}
    # A duration on a shared runner is a report and never turns the run red; a shard with no report is named in the job's output.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun --version
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: junit-*
          merge-multiple: true
          path: .
      # The check alone: `bun run check:test-durations` would run the whole fast lane again first.
      - run: bun scripts/check-test-durations.ts
