# Advisory full suite on every push to `main` (COR-2369): every stage of `bun run validate`,
# split into jobs so no job's peak memory passes the 16 GB standard runner (Cinder's suite peaked
# at 7.8 GB under coverage on a laptop, so it still runs alone). Nothing here is a required status
# check. Coverage (`bun run coverage`) and the publish-surface sweep (`bun run release:check`) are
# not part of `validate` and not run here.
# The Playwright browser suites, the Chromium fixture suite with screenshot comparison and
# Interborough's end-to-end suite, run in the `browser` job (`browser-suites.yml`, COR-2411).
name: Main

on:
  workflow_dispatch:
    inputs:
      chef_candidate:
        description: Exact revision authorized by Chef.
        required: false
        type: string
      verification_request:
        description: Immutable P07 verification request key.
        required: false
        type: string
      verification_plan:
        description: SHA-256 digest of the verification plan.
        required: false
        type: string
      verification_base:
        description: Candidate base commit.
        required: false
        type: string
  push:
    branches:
      - main
  # The nightly full run on `main`'s latest commit (owner decision, 2026-11-23): it runs `tests-slow`
  # and `browser` whatever `PAUSE_AUTOMATIC_SLOW_TESTS` says, so a pause on pushes never hides them for long.
  schedule:
    - cron: '17 9 * * *'

permissions:
  contents: read
  actions: read

run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.verification_request != '' && format('P07 {0}', inputs.verification_request) || github.workflow }}

# One group for every push and every scheduled run: a running run finishes, and a newer pending run replaces the older pending one.
# A manual dispatch (an exception validate on a branch, COR-2374) takes a group of its own per ref, so
# it never replaces a pending run from a push to `main`, and a newer dispatch on the same branch
# cancels the older one: a branch gets one full run, on its final head.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('main-dispatch-{0}', github.ref) || 'main' }}${{ inputs.chef_candidate != '' && inputs.chef_candidate != github.sha && '-stale-candidate' || '' }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

env:
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'
  # Vercel Remote Cache, shared with the owner's machine; empty, remote caching is off.
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  root:
    if: ${{ (inputs.chef_candidate == '' || inputs.chef_candidate == github.sha) }}
    name: Root checks, scripts tests, audit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun --version
      - run: bun install --frozen-lockfile
      - uses: ./.github/actions/turbo-cache/restore
        with:
          name: main-root
      # Component packages' derived metadata (schemas, variables, manifests) is generated, not
      # committed: the steps below run tests and servers outside Turborepo, so make it first.
      - run: bunx turbo run metadata
      - run: bun run lint:root
      - run: bun run typecheck:root
        if: ${{ !cancelled() }}
      # The two root tests go through their Turborepo tasks (`//#test:self`, `//#test:browser-fixtures`,
      # which write `test-output/junit/{self,browser-fixtures}.xml` as outputs), so an unchanged
      # run replays them from the cache and the JUnit upload below still finds the reports.
      - run: bunx turbo run //#test:self
        if: ${{ !cancelled() }}
      - run: bunx playwright install --with-deps chromium
        if: ${{ !cancelled() }}
      - run: bunx turbo run //#test:browser-fixtures
        if: ${{ !cancelled() }}
      - run: bun run format:check
        if: ${{ !cancelled() }}
      - run: bun run audit
        if: ${{ !cancelled() }}
      # JUnit is required aggregate evidence, not a best-effort diagnostic upload.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: junit-root
          overwrite: true
          path: |
            test-output/junit/*.xml
            applications/*/test-output/junit/*.xml
            components/*/test-output/junit/*.xml
            packages/*/test-output/junit/*.xml
            testing/*/test-output/junit/*.xml
            internal/*/test-output/junit/*.xml
            plugins/*/test-output/junit/*.xml
            scripts/browser-fixtures/test-output/junit/*.xml
          if-no-files-found: error
      - uses: ./.github/actions/turbo-cache/save
        if: ${{ !cancelled() }}

  workspaces:
    if: ${{ (inputs.chef_candidate == '' || inputs.chef_candidate == github.sha) }}
    name: Workspace lint and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun --version
      - run: bun install --frozen-lockfile
      - uses: ./.github/actions/turbo-cache/restore
        with:
          name: main-workspaces
      # Lint and type-check start no Bun test worker, so the test pool does not bound them; the
      # standard runner has 4 vCPUs and 16 GB (public repositories), so four tasks at a time. The
      # root `turbo.json` caps at 34%, which is one task here and is meant for the shared 12-core
      # development host.
      - run: bunx turbo run lint typecheck --continue --concurrency=4
      - uses: ./.github/actions/turbo-cache/save
        if: ${{ !cancelled() }}

  tests:
    if: ${{ (inputs.chef_candidate == '' || inputs.chef_candidate == github.sha) }}
    name: Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Cinder's suite peaked at 7.8 GB under coverage on a laptop, so it runs alone.
          - name: cinder
            filter: --filter=@lostgradient/cinder
          - name: components
            filter: --filter=./components/* --filter=!@lostgradient/cinder
          - name: packages
            filter: --filter=./packages/* --filter=!@lostgradient/weft --filter=!@lostgradient/bureau
          - name: applications, plugins, testing
            filter: --filter=./applications/* --filter=./plugins/* --filter=./testing/*
          - name: bureau
            filter: --filter=@lostgradient/bureau
          # This shard ran Weft's coverage run until COR-2370 and now runs its `test` task.
          - name: weft
            filter: --filter=@lostgradient/weft
          # Catch-all: it only excludes what the shards above select (including bureau and weft,
          # which live under packages/), so a new top-level workspace folder lands here rather
          # than in no shard.
          - name: everything else
            filter: --filter=!./components/* --filter=!./packages/* --filter=!./applications/* --filter=!./plugins/* --filter=!./testing/*
    env:
      # One task at a time: a task runs up to four Bun workers on a 4 vCPU runner.
      TURBO_CONCURRENCY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun --version
      - run: bun install --frozen-lockfile
      - uses: ./.github/actions/turbo-cache/restore
        with:
          name: main-tests-${{ matrix.name }}
      # The Postgres suites start a disposable cluster with `initdb` and `pg_ctl` from PATH; the
      # runner image installs PostgreSQL but leaves its binaries off PATH.
      - run: printf '%s\n' /usr/lib/postgresql/*/bin | tail -n 1 >> "$GITHUB_PATH"
      # The `test` task `bun run validate` runs for every workspace, not a coverage run.
      - run: bunx turbo run test --continue ${{ matrix.filter }}
      # JUnit is required aggregate evidence, not a best-effort diagnostic upload.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: junit-tests-${{ strategy.job-index }}
          overwrite: true
          path: |
            test-output/junit/*.xml
            applications/*/test-output/junit/*.xml
            components/*/test-output/junit/*.xml
            packages/*/test-output/junit/*.xml
            testing/*/test-output/junit/*.xml
            internal/*/test-output/junit/*.xml
            plugins/*/test-output/junit/*.xml
            scripts/browser-fixtures/test-output/junit/*.xml
          if-no-files-found: error
      - uses: ./.github/actions/turbo-cache/save
        if: ${{ !cancelled() }}

  tests-slow:
    name: Slow and integration tests
    if: ${{ (inputs.chef_candidate == '' || inputs.chef_candidate == github.sha) && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || vars.PAUSE_AUTOMATIC_SLOW_TESTS != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun --version
      - run: bun install --frozen-lockfile
      - uses: ./.github/actions/turbo-cache/restore
        with:
          name: main-tests-slow
      - run: printf '%s\n' /usr/lib/postgresql/*/bin | tail -n 1 >> "$GITHUB_PATH"
      # Integration tests that measure real layout launch Chromium (the chat stress measurement and
      # the design-review geometry probe), as the isolated lane in `pull-request.yml` does.
      - run: bunx playwright install --with-deps chromium
      # Bureau's event-history-run-ownership-recovery-lmdb integration test fails on `main` itself
      # (COR-2379); it is not marked advisory here.
      - run: bun run test:slow --continue --filter=!@lostgradient/ventriloquist
      - run: bunx turbo run test:slow --concurrency=1 --filter=@lostgradient/ventriloquist
        if: ${{ !cancelled() }}
      - uses: ./.github/actions/turbo-cache/save
        if: ${{ !cancelled() }}

  browser:
    name: Browser suites
    if: ${{ (inputs.chef_candidate == '' || inputs.chef_candidate == github.sha) && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || vars.PAUSE_AUTOMATIC_SLOW_TESTS != 'true') }}
    uses: ./.github/workflows/browser-suites.yml
    # The called workflow reads TURBO_TOKEN for the remote cache.
    secrets: inherit
    with:
      fixtures: true
      interborough: true

  # `check-test-durations` reads every workspace's JUnit report from the working tree, and each
  # shard above runs on its own runner, so the shards upload their reports and this job gathers
  # them. A shard that failed before it wrote a report makes this job fail with the workspace named.
  test-durations:
    name: Test durations
    needs: [root, tests]
    if: ${{ (inputs.chef_candidate == '' || inputs.chef_candidate == github.sha) && (!cancelled()) }}
    # A duration on a shared runner is a report and never turns the run or this job red: every
    # session read the red job as a failure to triage. A shard with no report is named in its output.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun --version
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: junit-*
          merge-multiple: true
          path: .
      # The check alone: `bun run check:test-durations` would run the whole fast lane again first.
      - run: bun scripts/check-test-durations.ts
        continue-on-error: true

  evidence:
    name: Evidence aggregate
    needs: [root, workspaces, tests, tests-slow, browser, test-durations]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      # Keep this failure in the existing job inventory. Bound delivery requires each job to pass.
      - name: Refuse a moved Chef candidate
        if: ${{ inputs.chef_candidate != '' && inputs.chef_candidate != github.sha }}
        run: |
          echo "::error::The branch moved after Chef approved this candidate."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # Keep one bundle per producing job within the run. A partial rerun replaces only the
      # bundles it rebuilds. The receipt itself remains immutable and pinned to its attempt.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ always() && (inputs.chef_candidate == '' || inputs.chef_candidate == github.sha) }}
        with:
          pattern: junit-*
          path: ci-evidence-artifacts
      - name: Record authenticated checkout identity
        env:
          VERIFICATION_REQUEST: ${{ inputs.verification_request }}
          VERIFICATION_PLAN: ${{ inputs.verification_plan }}
          VERIFICATION_BASE: ${{ inputs.verification_base }}
          CI_EVIDENCE_NEEDS: ${{ toJSON(needs) }}
          CI_EVIDENCE_NOT_APPLICABLE: ${{ github.event_name == 'push' && vars.PAUSE_AUTOMATIC_SLOW_TESTS == 'true' && '["tests-slow","browser"]' || '[]' }}
          CI_EVIDENCE_EXPECTED_JOBS: '["root","workspaces","tests","tests-slow","browser","test-durations"]'
          CI_EVIDENCE_ARTIFACT_DIRECTORY: ci-evidence-artifacts
        run: bun scripts/chef/ci-evidence-workflow.ts ci-evidence-receipt.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && (inputs.chef_candidate == '' || inputs.chef_candidate == github.sha) }}
        with:
          name: ci-evidence-receipt-${{ github.run_attempt }}
          path: ci-evidence-receipt.json
          if-no-files-found: error
