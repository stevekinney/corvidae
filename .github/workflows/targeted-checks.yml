name: COR-2659 retained credential evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-jammy
    timeout-minutes: 30
    env:
      QUALIFICATION_BASE: 7040a2667941964328504a36b1798c532f5133d1
      QUALIFICATION_SUBJECT: eef0e14156ea12292dba4d737e256061d0b7ee58
      TURBO_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
    steps:
      - name: Install the browser container's checkout and OCR tools
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends git unzip tesseract-ocr tesseract-ocr-eng
          tesseract --version
          dpkg-query -W git unzip tesseract-ocr tesseract-ocr-eng
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - name: Verify pinned source and stock runner OCR
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git merge-base --is-ancestor "$QUALIFICATION_BASE" "$QUALIFICATION_SUBJECT"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git log -1 --format=%P HEAD)" = d8f71026b682b377184ffb7010665fb22ec67054
          test "$(git log -1 --format=%P HEAD^)" = "$QUALIFICATION_SUBJECT"
          printf '%s\n' \
            .github/workflows/targeted-checks.yml \
            scripts/chef/proof-cor-2659/credential-qualification.spec.ts \
            scripts/chef/proof-cor-2659/qualification-run.sh \
            scripts/chef/proof-cor-2659/qualification-scan.ts \
            scripts/chef/proof-cor-2659/qualification.config.ts \
            | diff - <(git diff --name-only "$QUALIFICATION_SUBJECT" HEAD | LC_ALL=C sort)
          bun --version
      - run: bun install --frozen-lockfile
      - run: bunx turbo run metadata
      - name: Exercise and sanitize the isolated browser evidence
        shell: bash
        run: |
          export QUALIFICATION_RECIPE="$GITHUB_WORKSPACE/scripts/chef/proof-cor-2659"
          bash "$QUALIFICATION_RECIPE/qualification-run.sh"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cor2659-qualified-credential-evidence
          path: ${{ runner.temp }}/cor-2659/staged/
          if-no-files-found: error
          retention-days: 14
