name: Nine-port and Chat expiry qualification

on:
  workflow_dispatch:
    inputs:
      product_sha:
        description: Exact parent commit containing the reviewed product and test code.
        required: true
        type: string

permissions:
  contents: read

jobs:
  combined:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-jammy
    env:
      QUALIFICATION_SHA: ${{ inputs.product_sha }}
      TURBO_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
    steps:
      - shell: bash
        run: apt-get update && apt-get install -y --no-install-recommends git unzip
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - name: Establish immutable execution subject
        id: setup
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          [[ "$QUALIFICATION_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD^)" = "$QUALIFICATION_SHA"
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/targeted-checks.yml
          git checkout --detach "$QUALIFICATION_SHA"
          test -z "$(git status --porcelain)"
          bun install --frozen-lockfile
          mkdir -p qualification-output
          git rev-parse HEAD 'HEAD^{tree}' > qualification-output/product-identity.txt
          uname -a > qualification-output/runner.txt
          nproc >> qualification-output/runner.txt
          bun --version >> qualification-output/runner.txt
      - name: Prove ownership and contention across all nine services
        shell: bash
        run: |
          set -euo pipefail
          export QUALIFICATION_REQUEST="COR-2653-qualification:$QUALIFICATION_SHA"
          bun scripts/chef/cor-2653-qualification.ts
      - name: Prove the reviewed real Chat expiry flow and other cases
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$QUALIFICATION_SHA"
          bunx turbo run metadata
          status=0
          bun applications/interborough/scripts/run-gated-browser-suite.ts             applications/interborough/tests/e2e/chat-regeneration-expiry.spec.ts             --trace=retain-on-failure --reporter=line > qualification-output/chat-expiry.log 2>&1 || status=$?
          printf '%s\n' "$status" > qualification-output/chat-expiry.exit
          tail -40 qualification-output/chat-expiry.log
          test "$status" = 0
          grep -Eq 'Running 7 tests?([[:space:]]|$)' qualification-output/chat-expiry.log
          grep -Eq '7 passed([[:space:]]|$)' qualification-output/chat-expiry.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: reviewed-nine-port-and-expiry
          path: qualification-output/
          if-no-files-found: error
          retention-days: 14
