# Runs only the browser cases and unit test files a change reaches, on a branch, in minutes. A full
# `main.yml` run takes 80 to 170 minutes from dispatch (2026-11-16: up to 35 minutes waiting for
# runners, Cinder's whole unit suite at 47 minutes, a fixtures shard at 38), which is the wrong price
# for checking a one-line correction. Use this for every correction round; run `main.yml` once per
# batch.
#
#   gh workflow run targeted-checks.yml --ref <branch> \
#     -f fixture_components='approval-card,description-list' \
#     -f fixture_specs='scripts/browser-fixtures/tests/approval-card-input-rows.playwright.ts' \
#     -f e2e_specs='tests/e2e/chat-responsive.spec.ts tests/e2e/chat-toast-clearance.spec.ts' \
#     -f unit_workspace='components/cinder' -f unit_paths='src/components/approval-card'
#
# Every input is optional, and a job runs only when its inputs name something. The browser jobs copy
# the image and setup of `browser-suites.yml`, so the renderer and fonts are the baselines' own, and
# the fixtures job uploads `playwright-fixtures-targeted` on failure, which
# `scripts/browser-fixtures/scripts/baselines-from-run.ts <run id>` reads like a `main.yml` run's.
# `scripts/browser-fixtures/scripts/browser-suites-workflow.test.ts` keeps the image tag equal to the
# Playwright that `bun.lock` resolves. Inputs reach the shell through `env`, never interpolated.
name: Targeted checks

on:
  workflow_dispatch:
    inputs:
      fixture_components:
        description: Fixture component slugs for the screenshot suite, comma-separated (CINDER_TEST_COMPONENTS).
        type: string
        required: false
        default: ''
      fixture_specs:
        description: Fixture spec files, space-separated, from the repository root.
        type: string
        required: false
        default: ''
      e2e_specs:
        description: Interborough end-to-end spec files, space-separated, from applications/interborough.
        type: string
        required: false
        default: ''
      unit_workspace:
        description: The workspace folder whose unit test files to run, for example components/cinder.
        type: string
        required: false
        default: ''
      unit_paths:
        description: Test files or folders inside that workspace, space-separated.
        type: string
        required: false
        default: ''
      unit_config:
        description: A bunfig for the unit run, for example ./bunfig.ui.toml in applications/interborough.
        type: string
        required: false
        default: ''

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

jobs:
  fixtures:
    name: Chromium fixtures (targeted)
    if: ${{ inputs.fixture_components != '' || inputs.fixture_specs != '' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-jammy
    env:
      CINDER_VISUAL_DIFF: block
      CINDER_TEST_COMPONENTS: ${{ inputs.fixture_components }}
      FIXTURE_SPECS: ${{ inputs.fixture_specs }}
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git unzip
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun scripts/browser-fixtures/scripts/prepare-manifest.ts
      # Named components with no spec run the screenshot suite for those components alone.
      - run: |
          specs="$FIXTURE_SPECS"
          if [ -n "$CINDER_TEST_COMPONENTS" ]; then
            specs="$specs scripts/browser-fixtures/tests/components.playwright.ts"
          fi
          PLAYWRIGHT_HTML_OUTPUT_DIR="$GITHUB_WORKSPACE/playwright-output/report" \
          PLAYWRIGHT_JSON_OUTPUT_FILE="$GITHUB_WORKSPACE/playwright-output/results.json" \
          bun --bun playwright test --config scripts/browser-fixtures/playwright.config.ts \
            --project=chromium --workers=4 --reporter=line,html,json $specs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        continue-on-error: true
        with:
          name: playwright-fixtures-targeted
          path: |
            playwright-output/
            scripts/browser-fixtures/test-results/
          retention-days: 14
          if-no-files-found: ignore

  interborough:
    name: Interborough end-to-end (targeted)
    if: ${{ inputs.e2e_specs != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-jammy
    env:
      E2E_SPECS: ${{ inputs.e2e_specs }}
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git unzip
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: |
          PLAYWRIGHT_HTML_OUTPUT_DIR="$GITHUB_WORKSPACE/playwright-output/report" \
          PLAYWRIGHT_JSON_OUTPUT_FILE="$GITHUB_WORKSPACE/playwright-output/results.json" \
          bun applications/interborough/scripts/run-gated-browser-suite.ts \
            --trace=retain-on-failure --reporter=line,html,json $E2E_SPECS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        continue-on-error: true
        with:
          name: playwright-interborough-targeted
          path: |
            playwright-output/
            applications/interborough/test-results/
          retention-days: 14
          if-no-files-found: ignore

  unit:
    name: Unit test files (targeted)
    if: ${{ inputs.unit_workspace != '' && inputs.unit_paths != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UNIT_WORKSPACE: ${{ inputs.unit_workspace }}
      UNIT_PATHS: ${{ inputs.unit_paths }}
      UNIT_CONFIG: ${{ inputs.unit_config }}
      TZ: UTC
      LANG: en_US.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: |
          cd "$UNIT_WORKSPACE"
          config=""
          if [ -n "$UNIT_CONFIG" ]; then config="--config=$UNIT_CONFIG"; fi
          bun test $config --conditions browser --conditions svelte $UNIT_PATHS
