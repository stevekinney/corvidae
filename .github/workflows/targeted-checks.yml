name: COR-2654 cold overlap comparison

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUBJECT_BASE: a1ccdcb653c5106fbe29a2b6743a06c0b06f343a
      SUBJECT_CANDIDATE: f181dfe6af51c7ab64cdc0fb9164c2be169963a1
      SUBJECT_TREE: 24ea2096c819e5cc1ed981fcb02c246149cb7484
      TURBO_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Verify Linux process ownership and checkout identities
        run: |
          bun applications/interborough/scripts/startup-process-control.ts "$RUNNER_TEMP/cor2654-control"
          bun applications/interborough/scripts/qualify-startup.ts --matcher-control
          test "$(git rev-parse "$SUBJECT_CANDIDATE^{tree}")" = "$SUBJECT_TREE"
          git merge-base --is-ancestor "$SUBJECT_BASE" "$SUBJECT_CANDIDATE"
          git diff --exit-code "$SUBJECT_BASE" "$SUBJECT_CANDIDATE" -- bun.lock
          bun --version
          nproc
      - name: Run the workspace type gate
        run: bunx turbo run typecheck --filter=@lostgradient/interborough
      - name: Measure separate cold worktrees on the same runner
        run: |
          mkdir "$RUNNER_TEMP/cor2654-comparison"
          output="$RUNNER_TEMP/cor2654-comparison"
          final=0
          for arm in base candidate; do
            if [[ "$arm" == base ]]; then
              revision="$SUBJECT_BASE"
            else
              revision="$SUBJECT_CANDIDATE"
            fi
            checkout="$RUNNER_TEMP/cor2654-cold-$arm"
            git worktree add --detach "$checkout" "$revision"
            test "$(git -C "$checkout" rev-parse HEAD)" = "$revision"
            test ! -e "$checkout/node_modules"
            test ! -e "$checkout/applications/interborough/build"
            install_start="$(date +%s%3N)"
            (cd "$checkout" && bun install --frozen-lockfile)
            jq -n --arg rev "$revision" --argjson begin "$install_start" \
              --argjson end "$(date +%s%3N)" '{revision:$rev,installMilliseconds:($end-$begin)}' \
              > "$output/$arm-install.json"
            code=0
            bun applications/interborough/scripts/qualify-startup.ts \
              "$checkout" "$RUNNER_TEMP/cor2654-home-$arm" "$output/$arm.json" dev || code=$?
            printf '%s\n' "$code" > "$output/$arm.exit"
            if [[ "$code" != 0 ]]; then final=1; fi
          done
          exit "$final"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: cor2654-cold-comparison
          path: |
            ${{ runner.temp }}/cor2654-control/process-control.json
            ${{ runner.temp }}/cor2654-comparison/
          if-no-files-found: error
          retention-days: 14
