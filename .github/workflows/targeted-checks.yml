name: COR-2654 changed token marker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  marker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUBJECT: 617f78d010731acf37ba4d40aa35d68570c64838
      SUBJECT_TREE: db2e97ae36eb557e204eb875ef9de936bd460184
      TURBO_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Read prior and changed token on the normal dev path
        run: |
          output="$RUNNER_TEMP/cor2654-token-proof"
          worktree="$RUNNER_TEMP/cor2654-token-worktree"
          home="$RUNNER_TEMP/cor2654-token-home"
          mkdir "$output"
          grep -Fxq 'VERSION_ID="26.04"' /etc/os-release
          git worktree add --detach "$worktree" "$SUBJECT"
          test "$(git -C "$worktree" rev-parse 'HEAD^{tree}')" = "$SUBJECT_TREE"
          test ! -e "$worktree/components/cinder/src/styles/tokens-base.css"
          (cd "$worktree" && bun install --frozen-lockfile) > "$output/install.log" 2>&1
          sha256sum "$worktree/bun.lock" > "$output/lock.sha256"
          baseline=0
          bun applications/interborough/scripts/qualify-startup.ts "$worktree" "$home" "$output/baseline.json" dev > "$output/baseline.log" 2>&1 || baseline=$?
          printf '%s\n' "$baseline" > "$output/baseline.exit"
          test "$baseline" = 0
          grep -m 1 -E -- '--cinder-space-1:[[:space:]]*0?\.25rem;' "$worktree/components/cinder/src/styles/tokens-base.css" > "$output/baseline-declaration.txt"
          changed=0
          bun scripts/chef/cor2654-marker-probe.ts "$worktree" "$home" applications/interborough/scripts/qualify-startup.ts "$output/changed.json" token > "$output/changed.log" 2>&1 || changed=$?
          printf '%s\n' "$changed" > "$output/changed.exit"
          exit "$changed"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: cor2654-token-marker
          path: ${{ runner.temp }}/cor2654-token-proof/
          if-no-files-found: error
          retention-days: 14
