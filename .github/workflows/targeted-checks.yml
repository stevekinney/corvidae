name: COR-2655 selector shadow

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: Selector shadow (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        mode: [selected, exhaustive-fast, exhaustive-isolated]
    env:
      SUBJECT_REVISION: 4c69562549612d884a3035e842fcd031fc5181a3
      SUBJECT_TREE: 76b8cfdb05dd64a24fee006f78a493be6b266870
      SUBJECT_BASE: a1ccdcb653c5106fbe29a2b6743a06c0b06f343a
      MODE: ${{ matrix.mode }}
      TURBO_CACHE: local:rw
      TURBO_CONCURRENCY: '1'
      TURBO_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SUBJECT_REVISION }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - name: Verify source, inputs, and independent cache
        run: |
          [[ "$(git rev-parse HEAD)" == "$SUBJECT_REVISION" ]]
          [[ "$(git rev-parse 'HEAD^{tree}')" == "$SUBJECT_TREE" ]]
          git merge-base --is-ancestor "$SUBJECT_BASE" "$SUBJECT_REVISION"
          test ! -e .turbo/cache
          git --no-pager diff --name-only "$SUBJECT_BASE...$SUBJECT_REVISION"
          sha256sum bun.lock
          bun --version
          nproc
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bunx turbo run metadata
      - run: printf '%s\n' /usr/lib/postgresql/*/bin | tail -n 1 >> "$GITHUB_PATH"
      - name: Run isolated comparison arm
        run: |
          set -o pipefail
          case "$MODE" in
            selected) bun scripts/affected-tests.ts run --isolated --base "$SUBJECT_BASE" ;;
            exhaustive-fast) bunx turbo run test:self test test:browser-fixtures --continue --concurrency=1 ;;
            exhaustive-isolated) bunx turbo run test:slow test:self:slow --continue --concurrency=1 ;;
            *) exit 2 ;;
          esac
      - name: Retain covered case reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: shadow-${{ matrix.mode }}
          path: |
            test-output/junit/*.xml
            applications/*/test-output/junit/*.xml
            components/*/test-output/junit/*.xml
            packages/*/test-output/junit/*.xml
            testing/*/test-output/junit/*.xml
            internal/*/test-output/junit/*.xml
            plugins/*/test-output/junit/*.xml
            scripts/browser-fixtures/test-output/junit/*.xml
          if-no-files-found: error
          retention-days: 14
