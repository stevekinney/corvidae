name: COR-2654 startup diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUBJECT_BASE: a1ccdcb653c5106fbe29a2b6743a06c0b06f343a
      TURBO_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Verify Linux process ownership and cleanup
        run: bun applications/interborough/scripts/startup-process-control.ts "$RUNNER_TEMP/cor2654-control"
      - name: Pin a fresh base worktree
        run: |
          base="$RUNNER_TEMP/cor2654-base"
          git worktree add --detach "$base" "$SUBJECT_BASE"
          test "$(git -C "$base" rev-parse HEAD)" = "$SUBJECT_BASE"
          test ! -e "$base/node_modules"
          sha256sum "$base/bun.lock"
          git rev-parse HEAD 'HEAD^{tree}'
          bun --version
          nproc
          install_start="$(date +%s%3N)"
          (cd "$base" && bun install --frozen-lockfile)
          jq -n --arg rev "$SUBJECT_BASE" --argjson begin "$install_start" \
            --argjson end "$(date +%s%3N)" '{revision:$rev,installMilliseconds:($end-$begin)}' \
            > "$RUNNER_TEMP/cor2654-install.json"
      - name: Measure cold startup and persisted settings on original base
        run: |
          bun applications/interborough/scripts/qualify-startup.ts \
            "$RUNNER_TEMP/cor2654-base" "$RUNNER_TEMP/cor2654-home" \
            "$RUNNER_TEMP/cor2654-baseline.json" dev
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: cor2654-linux-diagnostic
          path: |
            ${{ runner.temp }}/cor2654-control/process-control.json
            ${{ runner.temp }}/cor2654-install.json
            ${{ runner.temp }}/cor2654-baseline.json
          if-no-files-found: error
          retention-days: 14
