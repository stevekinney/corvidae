name: COR-2653 exact Chat approval comparison

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-jammy
    timeout-minutes: 30
    env:
      BASE: a863433855877012ee94426c6c1ef816e76d6200
      CANDIDATE: 6b0884a072f5304a337b0c6149ac27f3a5d94765
      CI: 'true'
      TURBO_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
    steps:
      - shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git unzip
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - name: Compare the same real test under the original container settings
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD^)" = "$CANDIDATE"
          test "$(git diff --name-only "$CANDIDATE" HEAD)" = .github/workflows/targeted-checks.yml
          git merge-base --is-ancestor "$BASE" "$CANDIDATE"
          git diff --exit-code "$BASE" "$CANDIDATE" -- bun.lock applications/interborough/tests/e2e/chat-regeneration-expiry.spec.ts
          output="$RUNNER_TEMP/cor2653-chat-control"
          mkdir "$output"
          bun --version > "$output/bun.txt"
          nproc > "$output/processors.txt"
          locale > "$output/locale.txt"
          for arm in base candidate; do
            revision="$BASE"
            if [[ "$arm" == candidate ]]; then revision="$CANDIDATE"; fi
            checkout="$RUNNER_TEMP/cor2653-chat-$arm"
            git worktree add --detach "$checkout" "$revision"
            git -C "$checkout" rev-parse HEAD 'HEAD^{tree}' > "$output/$arm-identity.txt"
            test ! -e "$checkout/node_modules"
            (cd "$checkout" && bun install --frozen-lockfile) > "$output/$arm-install.log" 2>&1
          done
          measure() {
            local label="$1" arm="$2" scope="$3" status=0
            local checkout="$RUNNER_TEMP/cor2653-chat-$arm"
            local filter=()
            if [[ "$scope" == isolated ]]; then
              filter=(--grep 'expired approval desktop interaction profile.*shows durable expired approval history and retries through a fresh real turn at desktop')
            fi
            (
              cd "$checkout"
              bun applications/interborough/scripts/run-gated-browser-suite.ts \
                applications/interborough/tests/e2e/chat-regeneration-expiry.spec.ts \
                --trace=retain-on-failure --reporter=line "${filter[@]}"
            ) > "$output/$label-$arm.log" 2>&1 || status=$?
            printf '%s\n' "$status" > "$output/$label-$arm.exit"
          }
          measure named base isolated
          measure named candidate isolated
          measure spec candidate file
          measure spec base file
          for f in "$output"/{named,spec}-{base,candidate}.log; do
            printf '%s exit %s\n' "$(basename "$f")" "$(cat "${f%.log}.exit")"
            if [[ "$(basename "$f")" == named-* ]]; then
              grep -Eq 'Running 1 test([^[:alpha:]]|$)' "$f"
            else
              grep -Eq 'Running [1-9][0-9]* tests?' "$f"
            fi
            grep -E 'Running [0-9]+ tests?|[0-9]+ passed|[0-9]+ failed|Expected:|Received:' "$f" || true
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: cor2653-chat-approval-control
          path: ${{ runner.temp }}/cor2653-chat-control/
          if-no-files-found: error
          retention-days: 14
