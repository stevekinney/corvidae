name: COR-2654 startup qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        order: [base-first-1, candidate-first-2, base-first-3]
    env:
      SUBJECT_BASE: 9f8d304a09ac2c6f34d6817fb587d3d0133601d1
      SUBJECT_CANDIDATE: b6cf80efe7380154d5b77dc29b0b784d8803faa9
      SUBJECT_TREE: 1d25c1e8c5fe458589f42bbda3a1d3aa8f5b7893
      TURBO_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Ownership and probe controls
        run: |
          bun applications/interborough/scripts/startup-process-control.ts "$RUNNER_TEMP/cor2654-control"
          bun applications/interborough/scripts/qualify-startup.ts --matcher-control
          bun applications/interborough/scripts/qualify-startup.ts --profile-control
          test "$(git rev-parse HEAD^)" = "$SUBJECT_CANDIDATE"
          test "$(git diff --name-only "$SUBJECT_CANDIDATE" HEAD)" = .github/workflows/targeted-checks.yml
          test "$(git rev-parse "$SUBJECT_CANDIDATE^{tree}")" = "$SUBJECT_TREE"
          git merge-base --is-ancestor "$SUBJECT_BASE" "$SUBJECT_CANDIDATE"
          git diff --exit-code "$SUBJECT_BASE" "$SUBJECT_CANDIDATE" -- bun.lock
      - name: Measure isolated cold actions
        env:
          PAIR_ORDER: ${{ matrix.order }}
        run: |
          output="$RUNNER_TEMP/cor2654-pair"
          mkdir "$output"
          { printf 'image=%s\nimage_version=%s\norder=%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}" "$PAIR_ORDER"; uname -a; nproc; cat /etc/os-release; head -3 /proc/meminfo; bun --version; } > "$output/runner.txt"
          grep -Fxq 'VERSION_ID="26.04"' /etc/os-release
          case "$PAIR_ORDER" in candidate-first-*) arms='candidate base';; *) arms='base candidate';; esac
          final=0
          for arm in $arms; do
            if [[ "$arm" == base ]]; then revision="$SUBJECT_BASE"; else revision="$SUBJECT_CANDIDATE"; fi
            checkout="$RUNNER_TEMP/cor2654-$arm"
            git worktree add --detach "$checkout" "$revision"
            test "$(git -C "$checkout" rev-parse HEAD)" = "$revision"
            git -C "$checkout" rev-parse HEAD 'HEAD^{tree}' > "$output/$arm-identity.txt"
            sha256sum "$checkout/bun.lock" | awk '{print $1}' > "$output/$arm-lock.sha256"
            test ! -e "$checkout/node_modules"
            test ! -e "$checkout/applications/interborough/build"
            test ! -e "$checkout/applications/interborough/.cache/svelte-transforms"
            test ! -e "$checkout/components/cinder/.metadata"
            (cd "$checkout" && bun install --frozen-lockfile) > "$output/$arm-install.log" 2>&1
            test ! -e "$checkout/components/cinder/.metadata"
            (cd "$checkout" && bun -e 'import { CINDER_GENERATED_OUTPUTS } from "./scripts/ensure-cinder-generated.ts"; for (const path of CINDER_GENERATED_OUTPUTS) if (await Bun.file("components/cinder/" + path).exists()) throw new Error("Generated output exists: " + path)')
            cgroup_relative="$(awk -F: '$1 == "0" {print $3}' /proc/self/cgroup)"
            cgroup_events="/sys/fs/cgroup${cgroup_relative%/}/memory.events"
            if [[ -r "$cgroup_events" ]]; then cat "$cgroup_events"; else printf '%s\n' unavailable; fi > "$output/$arm-memory-before.txt"
            bun applications/interborough/scripts/qualify-startup.ts "$checkout" "$RUNNER_TEMP/cor2654-home-$arm" "$output/$arm.json" dev > "$output/$arm-driver.log" 2>&1 &
            driver=$!
            (
              while [[ ! -e "$output/$arm-sampling-done" ]]; do
                stamp="$(date +%s%3N)"
                ps -eo pid=,ppid=,rss= | awk -v root="$driver" -v time="$stamp" '
                  { pid[NR]=$1; parent[NR]=$2; rss[NR]=$3 }
                  END {
                    owned[root]=1
                    for (pass=0; pass<20; pass++) for (i=1; i<=NR; i++) if (owned[parent[i]]) owned[pid[i]]=1
                    for (i=1; i<=NR; i++) if (owned[pid[i]]) print time, pid[i], parent[i], rss[i]
                  }' >> "$output/$arm-memory-samples.txt"
                sleep 1
              done
            ) &
            sampler=$!
            code=0
            wait "$driver" || code=$?
            touch "$output/$arm-sampling-done"
            wait "$sampler"
            printf '%s\n' "$code" > "$output/$arm.exit"
            awk '{ sum[$1]+=$4 } END { for (stamp in sum) if (sum[stamp]>peak) peak=sum[stamp]; if (!peak) exit 1; print peak }' "$output/$arm-memory-samples.txt" > "$output/$arm-sampled-peak-rss-kib.txt"
            if [[ -r "$cgroup_events" ]]; then cat "$cgroup_events"; else printf '%s\n' unavailable; fi > "$output/$arm-memory-after.txt"
            (cd "$checkout" && bun -e 'import { CINDER_GENERATED_OUTPUTS } from "./scripts/ensure-cinder-generated.ts"; for (const path of CINDER_GENERATED_OUTPUTS) console.log("components/cinder/" + path)') > "$output/$arm-expected.txt"
            (cd "$checkout" && { cat "$output/$arm-expected.txt"; if [[ -d components/cinder/.metadata ]]; then find components/cinder/.metadata -type f -print; fi; } | LC_ALL=C sort -u | while IFS= read -r file; do if [[ -f "$file" ]]; then sha256sum "$file"; else printf 'MISSING %s\n' "$file"; fi; done) > "$output/$arm-generated.sha256"
            git -C "$checkout" status --porcelain > "$output/$arm-status.txt"
            if [[ "$arm" == candidate ]]; then
              jq -e '
                [.lines[].text | select(contains("STARTUP {")) | sub("^.*STARTUP "; "") | fromjson | select(.stage == "ui-bundle") | .transforms] as $transforms |
                .contract.action == "valid" and .contract.instrumentation == "complete" and
                ($transforms | length == 1 and all(.hits == 0 and .misses > 0))
              ' "$output/$arm.json" > "$output/$arm-cold-verified.json" || final=1
            fi
            if [[ "$code" != 0 || -s "$output/$arm-status.txt" ]] || awk '/^MISSING / { found=1 } END { exit !found }' "$output/$arm-generated.sha256"; then final=1; fi
          done
          cmp "$output/base-lock.sha256" "$output/candidate-lock.sha256" || final=1
          cmp "$output/base-generated.sha256" "$output/candidate-generated.sha256" || final=1
          exit "$final"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: cor2654-cold-${{ matrix.order }}
          path: |
            ${{ runner.temp }}/cor2654-control/process-control.json
            ${{ runner.temp }}/cor2654-pair/
          if-no-files-found: error
          retention-days: 14
  profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE: 9f8d304a09ac2c6f34d6817fb587d3d0133601d1
      CANDIDATE: b6cf80efe7380154d5b77dc29b0b784d8803faa9
      CANDIDATE_TREE: 1d25c1e8c5fe458589f42bbda3a1d3aa8f5b7893
      TURBO_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Verify source, runner and process ownership
        run: |
          grep -Fxq 'VERSION_ID="26.04"' /etc/os-release
          test "$(git rev-parse HEAD^)" = "$CANDIDATE"
          test "$(git rev-parse "$CANDIDATE^{tree}")" = "$CANDIDATE_TREE"
          test "$(git diff --name-only "$CANDIDATE" HEAD)" = .github/workflows/targeted-checks.yml
          git diff --exit-code "$BASE" "$CANDIDATE" -- bun.lock
          bun applications/interborough/scripts/startup-process-control.ts "$RUNNER_TEMP/cor2654-control"
          bun applications/interborough/scripts/qualify-startup.ts --matcher-control
          bun applications/interborough/scripts/qualify-startup.ts --profile-control
      - name: Measure isolated dev, three warm pairs and production
        run: |
          output="$RUNNER_TEMP/cor2654-warm"
          mkdir "$output"
          {
            printf 'image=%s\nimage_version=%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
            uname -a
            nproc
            head -3 /proc/meminfo
            bun --version
          } > "$output/runner.txt"
          for arm in base candidate production; do
            revision="$CANDIDATE"
            if [[ "$arm" == base ]]; then revision="$BASE"; fi
            checkout="$RUNNER_TEMP/cor2654-$arm"
            git worktree add --detach "$checkout" "$revision"
            git -C "$checkout" rev-parse HEAD 'HEAD^{tree}' > "$output/$arm-identity.txt"
            test ! -e "$checkout/node_modules"
            test ! -e "$checkout/applications/interborough/build"
            test ! -e "$checkout/applications/interborough/.cache/svelte-transforms"
            test ! -e "$checkout/components/cinder/.metadata"
            start="$(date +%s%3N)"
            status=0
            (cd "$checkout" && bun install --frozen-lockfile) > "$output/$arm-install.log" 2>&1 || status=$?
            jq -n --argjson start "$start" --argjson end "$(date +%s%3N)" --argjson status "$status" '{milliseconds:($end-$start),exit:$status}' > "$output/$arm-install.json"
            test "$status" = 0
            test ! -e "$checkout/components/cinder/.metadata"
          done
          measure() {
            local arm="$1" label="$2" profile="$3" status=0
            bun applications/interborough/scripts/qualify-startup.ts "$RUNNER_TEMP/cor2654-$arm" "$RUNNER_TEMP/cor2654-home-$arm" "$output/$label.json" "$profile" > "$output/$label.log" 2>&1 || status=$?
            printf '%s\n' "$status" > "$output/$label.exit"
            return "$status"
          }
          fingerprint_browser_build() {
            (
              cd "$RUNNER_TEMP/cor2654-candidate/applications/interborough/build" || exit 1
              test -f index.html || exit 1
              find . -type f ! -name .retained-assets.json -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum
            ) > "$output/$1-browser-build.sha256"
          }
          verdict=0
          measure base base-initial dev &
          base_pid=$!
          measure candidate candidate-initial dev &
          candidate_pid=$!
          wait "$base_pid" || verdict=1
          wait "$candidate_pid" || verdict=1
          if [[ "$verdict" == 0 ]]; then
            jq -en --slurpfile a "$output/base-initial.json" --slurpfile b "$output/candidate-initial.json" '
              $a[0].home != $b[0].home and $a[0].url != $b[0].url and
              ($a[0].startedAt[:19] + "Z" | fromdateiso8601) < (($b[0].startedAt[:19] + "Z" | fromdateiso8601) + $b[0].actionMilliseconds / 1000) and
              ($b[0].startedAt[:19] + "Z" | fromdateiso8601) < (($a[0].startedAt[:19] + "Z" | fromdateiso8601) + $a[0].actionMilliseconds / 1000)
            ' > "$output/isolated-overlap.json" || verdict=1
            for arm in base candidate; do
              checkout="$RUNNER_TEMP/cor2654-$arm"
              printf 'cor2654-%s\n' "$arm" > "$checkout/node_modules/.cor2654-install-marker"
              (cd "$checkout" && bun install --frozen-lockfile) > "$output/$arm-repeat-install.log" 2>&1 || verdict=1
              if cmp -s "$checkout/node_modules/.cor2654-install-marker" <(printf 'cor2654-%s\n' "$arm"); then
                printf 'true\n' > "$output/$arm-marker-retained.json"
              else
                verdict=1
              fi
            done
          fi
          if [[ "$verdict" == 0 ]]; then
            fingerprint_browser_build candidate-initial || verdict=1
            previous=initial
            for pair in 1 2 3; do
              arms=(base candidate)
              if [[ "$pair" == 2 ]]; then arms=(candidate base); fi
              for arm in "${arms[@]}"; do
                measure "$arm" "$arm-$pair" dev || verdict=1
                jq -en --slurpfile before "$output/$arm-$previous.json" --slurpfile after "$output/$arm-$pair.json" '
                  $before[0].settings.persisted == $after[0].settings.previous and $after[0].contract.action == "valid"
                ' > "$output/$arm-$pair-reopen.json" || verdict=1
              done
              previous="$pair"
              fingerprint_browser_build "candidate-$pair" || verdict=1
              cmp "$output/candidate-initial-browser-build.sha256" "$output/candidate-$pair-browser-build.sha256" || verdict=1
              jq -e '
                [.lines[].text | select(contains("STARTUP {")) | sub("^.*STARTUP "; "") | fromjson] as $events |
                {contract, cinder: [$events[] | select(.stage == "cinder")], panels: [$events[] | select(.stage == "panel")], ui: [$events[] | select(.stage == "ui-bundle")]} |
                select(.contract.instrumentation == "complete" and (.cinder | length > 0 and all(.generated == false)) and (.panels | length == 7 and all(.built == false and .outcome == "ready")) and (.ui | length == 1 and all(.transforms.hits > 0 and .transforms.misses == 0)))
              ' "$output/candidate-$pair.json" > "$output/candidate-$pair-warm-producers.json" || verdict=1
            done
          fi
          measure production production production || verdict=1
          jq -e '.contract.action == "valid" and .contract.instrumentation == "complete" and .productionBuild.exit == 0' "$output/production.json" > "$output/production-verified.json" || verdict=1
          exit "$verdict"
      - name: Verify changed token and panel served in the application
        run: |
          output="$RUNNER_TEMP/cor2654-warm"
          marker_script="$GITHUB_WORKSPACE/.cor2654-marker-probe.ts"
          cat > "$marker_script" <<'COR2654_MARKER_SCRIPT'
          /** Proof-only marker check. Run on a disposable clean checkout after its warm start. */
          import { chromium, expect } from '@playwright/test';
          import { readFile, writeFile } from 'node:fs/promises';
          import { join, resolve } from 'node:path';

          const [checkoutArgument, homeArgument, driverArgument, outputArgument, mode] = process.argv.slice(2);
          if (!checkoutArgument || !homeArgument || !driverArgument || !outputArgument || !['token', 'panel'].includes(mode ?? '')) throw new Error('Usage: marker-probe.ts <checkout> <home> <driver> <output> <token|panel>');
          const checkout = resolve(checkoutArgument);
          const home = resolve(homeArgument);
          const driver = resolve(driverArgument);
          const output = resolve(outputArgument);
          const status = Bun.spawnSync(['git', 'status', '--porcelain'], { cwd: checkout, stdout: 'pipe', stderr: 'pipe' });
          if (status.exitCode !== 0 || status.stdout.length !== 0) throw new Error('Marker checkout must begin clean');
          const source = join(checkout, mode === 'token' ? 'components/cinder/src/tokens/sets/foundation.tokens.json' : 'plugins/inspectors/src/run-inspector/inspector.svelte');
          const original = await readFile(source, 'utf8');
          const expression = mode === 'token' ? /("one":\s*\{\s*"\$value":\s*\{\s*"value":\s*)0\.25/ : /id="inspector-status"/;
          const matches = [...original.matchAll(new RegExp(expression.source, 'g'))];
          if (matches.length !== 1) throw new Error('Expected exactly one marker insertion point');
          const modified = mode === 'token'
            ? original.replace(expression, (_match, prefix: string) => `${prefix}0.3125`)
            : original.replace(expression, 'id="inspector-status" data-cor2654-marker="cor2654-panel-marker"');
          const receipt: Record<string, unknown> = { mode, source: mode === 'token' ? 'foundation.tokens.json' : 'inspector.svelte', startedAt: new Date().toISOString() };
          const started = performance.now();
          const lines: Array<{ milliseconds: number; text: string }> = [];
          let host: ReturnType<typeof Bun.spawn<'ignore', 'pipe', 'pipe'>> | undefined;
          let interrupted = false;
          const stop = () => {
            interrupted = true;
            if (host !== undefined && host.exitCode === null && host.signalCode === null) host.kill('SIGTERM');
          };
          process.on('SIGINT', stop);
          process.on('SIGTERM', stop);
          try {
            await writeFile(source, modified);
            if (interrupted) throw new Error('Marker probe interrupted before startup');
            host = Bun.spawn(['bun', driver, '--supervise', checkout, 'dev'], {
              cwd: checkout,
              env: { ...process.env, INTERBOROUGH_HOME: home, INTERBOROUGH_PORT: '0', INTERBOROUGH_STARTUP_PROFILE: '1' },
              stdout: 'pipe', stderr: 'pipe',
            });
            let found!: (url: string) => void;
            const listener = new Promise<string>((resolveListener) => { found = resolveListener; });
            const collect = async (stream: ReadableStream<Uint8Array>) => {
              const reader = stream.getReader();
              const decoder = new TextDecoder();
              let pending = '';
              for (;;) {
                const chunk = await reader.read();
                if (chunk.done) break;
                pending += decoder.decode(chunk.value, { stream: true });
                const parts = pending.split('\n');
                pending = parts.pop() ?? '';
                for (const text of parts) {
                  lines.push({ milliseconds: performance.now() - started, text });
                  const match = /Interborough is listening on (http:\/\/\S+)/.exec(text);
                  if (match?.[1]) found(match[1]);
                }
              }
              pending += decoder.decode();
              if (pending) lines.push({ milliseconds: performance.now() - started, text: pending });
            };
            const streams = Promise.all([collect(host.stdout), collect(host.stderr)]);
            try {
              const url = await Promise.race([listener, host.exited.then((code) => { throw new Error(`Host exited before listening: ${code}`); })]);
              const browser = await chromium.launch({ headless: true });
              try {
                const page = await browser.newPage();
                const pageErrors: string[] = [];
                let consoleErrors = 0;
                page.on('pageerror', (error) => pageErrors.push(error.name));
                page.on('console', (message) => { if (message.type() === 'error') consoleErrors += 1; });
                const navigation = await page.goto(new URL('/settings/data-and-retention', url).href);
                const row = page.locator('[data-setting="retention.audit"]');
                const input = row.getByRole('spinbutton');
                const previous = await input.inputValue();
                const next = previous === '365' ? '90' : '365';
                await input.fill(next);
                await input.blur();
                await row.getByText('Saved just now').waitFor();
                await page.reload();
                await expect(input).toHaveValue(next);
                let markerObserved = false;
                if (mode === 'token') {
                  markerObserved = await page.evaluate(() => getComputedStyle(document.documentElement).getPropertyValue('--cinder-space-1').trim() === '0.3125rem');
                } else {
                  const response = await fetch(new URL('/host/plugins/inspectors/apps/run-inspector', url));
                  const body: unknown = await response.json();
                  markerObserved = response.ok && typeof body === 'object' && body !== null && 'html' in body && typeof body.html === 'string' && body.html.includes('cor2654-panel-marker');
                }
                receipt['navigationStatus'] = navigation?.status() ?? null;
                receipt['settingsPersisted'] = await input.inputValue() === next;
                const events = lines.flatMap(({ text }) => {
                  const start = text.indexOf('STARTUP {');
                  return start < 0 ? [] : [JSON.parse(text.slice(start + 'STARTUP '.length)) as Record<string, unknown>];
                });
                const producerRan = mode === 'token'
                  ? events.some((event) => event['stage'] === 'cinder' && event['generated'] === true)
                  : events.some((event) => event['stage'] === 'panel' && event['plugin'] === 'inspectors' &&
                      event['panel'] === 'run-inspector' && event['outcome'] === 'ready' && event['built'] === true);
                receipt['producerRan'] = producerRan;
                receipt['markerObserved'] = markerObserved;
                receipt['pageErrors'] = pageErrors;
                receipt['consoleErrors'] = consoleErrors;
                receipt['actionMilliseconds'] = performance.now() - started;
                if (navigation?.status() !== 200 || !markerObserved || !producerRan || pageErrors.length > 0 || consoleErrors > 0 || interrupted) throw new Error('Required marker or browser action failed');
              } finally { await browser.close(); }
            } finally {
              if (host.exitCode === null && host.signalCode === null) host.kill('SIGTERM');
              const exit = await host.exited;
              receipt['hostExit'] = exit;
              if (exit !== 0 && exit !== 143) {
                receipt['cleanupError'] = `The supervised host exited ${exit}`;
                process.exitCode = 1;
              }
              await streams;
            }
          } catch (error) {
            receipt['error'] = error instanceof Error ? error.message : String(error);
            process.exitCode = 1;
          } finally {
            process.off('SIGINT', stop);
            process.off('SIGTERM', stop);
            await writeFile(source, original);
            const restored = Bun.spawnSync(['git', 'status', '--porcelain'], { cwd: checkout, stdout: 'pipe', stderr: 'pipe' });
            receipt['restoredClean'] = restored.exitCode === 0 && restored.stdout.length === 0;
            receipt['lines'] = lines;
            if (!receipt['restoredClean']) process.exitCode = 1;
            await writeFile(output, `${JSON.stringify(receipt, null, 2)}\n`);
          }
          COR2654_MARKER_SCRIPT
          sha256sum "$marker_script" > "$output/marker-script.sha256"
          final=0
          for mode in token panel; do
            code=0
            bun "$marker_script" "$RUNNER_TEMP/cor2654-candidate" "$RUNNER_TEMP/cor2654-home-candidate" applications/interborough/scripts/qualify-startup.ts "$output/marker-$mode.json" "$mode" > "$output/marker-$mode.log" 2>&1 || code=$?
            printf '%s\n' "$code" > "$output/marker-$mode.exit"
            if [[ "$code" != 0 ]]; then final=1; fi
          done
          exit "$final"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: cor2654-integrated-warm-profiles
          path: |
            ${{ runner.temp }}/cor2654-control/process-control.json
            ${{ runner.temp }}/cor2654-warm/
          if-no-files-found: error
          retention-days: 14
