name: Matched standalone Connect host controls

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connect:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-jammy
    env:
      BASE: fe39e5adb69e9e2962dd0b990d2309ec1b8f3f54
      CANDIDATE: 29ebf53f1c3da3e7d7215eb6cd261de0ca2f9178
      TURBO_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
    steps:
      - shell: bash
        run: apt-get update && apt-get install -y --no-install-recommends git unzip
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD^)" = "$CANDIDATE"
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/targeted-checks.yml
          git merge-base --is-ancestor "$BASE" "$CANDIDATE"
          git diff --exit-code "$BASE" "$CANDIDATE" -- bun.lock
          results="$RUNNER_TEMP/connect-cold-serial"
          mkdir "$results"
          {
            uname -a
            nproc
            bun --version
            cat /sys/fs/cgroup/memory.max
          } > "$results/runner.txt"
          spec=applications/interborough/tests/e2e/connect-host.integration.test.ts
          support=applications/interborough/tests/e2e/connect-host.test-support.ts
          for arm in base candidate; do
            revision="$BASE"
            if [[ "$arm" == candidate ]]; then revision="$CANDIDATE"; fi
            checkout="$RUNNER_TEMP/connect-serial-$arm"
            git worktree add --detach "$checkout" "$revision"
            git -C "$checkout" rev-parse HEAD 'HEAD^{tree}' > "$results/$arm-identity.txt"
            test ! -e "$checkout/node_modules"
            (cd "$checkout" && bun install --frozen-lockfile && bunx turbo run metadata) > "$results/$arm-setup.log" 2>&1
          done
          candidate_directory="$RUNNER_TEMP/connect-serial-candidate"
          baseline_directory="$RUNNER_TEMP/connect-serial-base"
          for fixture in "$spec" "$support"; do
            cp "$candidate_directory/$fixture" "$baseline_directory/$fixture"
            cmp "$candidate_directory/$fixture" "$baseline_directory/$fixture"
            sha256sum "$candidate_directory/$fixture" >> "$results/test-witness.sha256"
          done
          for arm in base candidate; do
            status=0
            checkout="$RUNNER_TEMP/connect-serial-$arm"
            date -u '+%FT%TZ' > "$results/$arm-start.txt"
            (cd "$checkout" && bun scripts/bun-test.ts "$spec") > "$results/$arm-connect.log" 2>&1 || status=$?
            date -u '+%FT%TZ' > "$results/$arm-finish.txt"
            printf '%s\n' "$status" > "$results/$arm.exit"
            tail -12 "$results/$arm-connect.log"
          done
          test "$(cat "$results/base.exit")" != 0
          grep -F 'Expected EADDRINUSE' "$results/base-connect.log"
          test "$(cat "$results/candidate.exit")" = 0
          grep -Eq '4 pass([^[:alpha:]]|$)' "$results/candidate-connect.log"
          ! grep -F 'did not build' "$results/base-connect.log" "$results/candidate-connect.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: connect-cold-serial
          path: ${{ runner.temp }}/connect-cold-serial/
          if-no-files-found: error
          retention-days: 14
