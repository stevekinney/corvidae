[loader]
".md" = "text"

[run]
bun = true

[test]
# Every test file runs with the shared guard that fails a test which leaves a real timer behind.
preload = ["@lostgradient/testing/real-timer-leak-guard"]
# Other workspaces are consumed as source, so their modules load into this suite too; they are
# measured by their own packages. The durability suite bodies are test bodies that the adapter
# packages run, as they were `*.test.ts` files before they moved here.
coveragePathIgnorePatterns = ["../**", "src/testing/durability/*.suite.test-support.ts"]
