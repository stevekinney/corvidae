[loader]
".md" = "text"

[run]
bun = true

[test]
# Every test file runs with the shared guard that fails a test which leaves a real timer behind.
preload = ["@lostgradient/testing/real-timer-leak-guard"]
# `bun run test:coverage` fails below these. They are no lower than the line and function coverage
# the same files had under Weft's coverage run before they moved here (COR-1778): `web-extension.ts` had
# every line and 58 of 61 functions covered at base. The three uncovered functions were the
# adapter's no-op change listener, which `web-extension.change-listener.test.ts` now calls, and the
# two `() => undefined` handlers on `previous.catch(...)` in `#withMutationLock`, which no input
# reaches because the queued promise never rejects. 59 of 61 is the most this suite can reach
# without changing the adapter, so the functions floor is 59/61 rounded down.
coverageThreshold = { lines = 1.0, functions = 0.967213 }
# Other workspaces are consumed as source, so their modules load into this suite too; they are
# measured by their own packages.
coveragePathIgnorePatterns = ["../**"]
