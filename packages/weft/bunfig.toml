[loader]
".md" = "text"

[run]
bun = true

[test]
coveragePathIgnorePatterns = [
  "scripts/check-coverage.ts",
  # Static fixture trees under src/cli/__fixtures__/validation/** are fixed
  # test input fed to CLI validation tests (src/cli/*.test.ts), not code
  # under test — instrumenting them just adds unowned lines/functions no
  # allowance or written test should ever need to describe.
  "src/cli/__fixtures__/**",
  # Byte-for-byte copies of `@lostgradient/testing`'s Svelte compile plugin and
  # its environment configuration (`scripts/check-test-support-copies.ts`
  # fails on any drift). Their behavior is tested where they are owned, in
  # `testing/testing/src/svelte-plugin.test.ts` and
  # `environment-configuration.test.ts`. The dashboard build test
  # (`scripts/build-dashboard.test.ts`) loads them in this shard only to
  # compile the UI, which reaches a fraction of their branches.
  "scripts/lib/svelte-plugin.ts",
  "scripts/lib/environment-configuration.ts",
]
# Nested git worktrees live inside the repo tree (Scrumlord task worktrees under
# `tmp/worktrees/`, agent worktrees under `.claude/worktrees/`), each holding a
# full `src/` tree on an unrelated branch. `bun test` discovers tests tree-wide
# even when given explicit paths (positional paths are prefix filters), so
# without this it runs thousands of stale tests from those worktrees. Ignoring
# them here fixes every `bun test` invocation — the pre-commit hook, `--watch`,
# and bare `bun test` runs from the project root alike.
# Standalone example packages have their own dependency graph and CI jobs. Keep
# their package-local tests out of root discovery; each example can override
# this from a nearer bunfig.toml when run from its own directory.
pathIgnorePatterns = [
  "**/tmp/worktrees/**",
  "**/.claude/worktrees/**",
  "examples/checkout/**",
]
# Runs once before any test file in the shared test process. Installs
# globalThis.indexedDB (via fake-indexeddb) so the storage suites and their
# fault harness reach the global without each test file importing the shim and
# risking order-dependent flakiness. Non-test helpers still import it
# explicitly. Lives under tests/ (not src/) so it never ships in dist/. The
# path resolves relative to this file (the package root), not the invocation
# cwd, so it holds for the pre-commit hook, `--watch`, and coverage runs alike.
# See tests/test-preload.ts.
preload = ["./tests/test-preload.ts"]
