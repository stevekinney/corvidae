<!-- @dsCard group="Page archetypes" height=640 subtitle="Focus list: a short list of what needs a person now, led by one Spotlight value." -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Focus list archetype</title>
    <!-- archetype-styles -->
  </head>
  <body>
    <main class="arch">
      <div class="arch__body">
        <div class="cinder-page-header">
          <div class="cinder-page-header__row">
            <div class="cinder-page-header__heading-group">
              <div class="cinder-page-header__title-line">
                <h1 class="cinder-page-header__title">Today</h1>
              </div>
            </div>
          </div>
        </div>
        <div class="cinder-spotlight">
          <p class="cinder-spotlight__value">2 need you</p>
          <p class="cinder-spotlight__caveat">The oldest has waited 22 minutes.</p>
        </div>
        <section class="cinder-section" aria-labelledby="focus-waiting-title">
          <div class="cinder-section__header">
            <div class="cinder-section__heading">
              <h2 id="focus-waiting-title" class="cinder-section__title">Waiting on you</h2>
            </div>
          </div>
          <div class="cinder-section__content">
            <div class="cinder-grouped-list">
              <ul class="cinder-grouped-list__group">
                <li class="cinder-grouped-list-item cinder-grouped-list-item--linked">
                  <div class="cinder-grouped-list-item__content">
                    <div class="cinder-grouped-list-item__text">
                      <div class="cinder-grouped-list-item__title">
                        <a class="cinder-grouped-list-item__link" href="#"
                          >Delete 14 stale branches</a
                        >
                      </div>
                    </div>
                    <div class="cinder-grouped-list-item__trailing">22 min</div>
                    <span class="cinder-grouped-list-item__chevron" aria-hidden="true"
                      ><svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="16"
                        height="16"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      >
                        <path d="m9 18 6-6-6-6" /></svg
                    ></span>
                  </div>
                </li>
                <li class="cinder-grouped-list-item cinder-grouped-list-item--linked">
                  <div class="cinder-grouped-list-item__content">
                    <div class="cinder-grouped-list-item__text">
                      <div class="cinder-grouped-list-item__title">
                        <a class="cinder-grouped-list-item__link" href="#"
                          >Run the migration on staging</a
                        >
                      </div>
                    </div>
                    <div class="cinder-grouped-list-item__trailing">4 min</div>
                    <span class="cinder-grouped-list-item__chevron" aria-hidden="true"
                      ><svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="16"
                        height="16"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      >
                        <path d="m9 18 6-6-6-6" /></svg
                    ></span>
                  </div>
                </li>
              </ul>
            </div>
          </div>
        </section>
        <section class="cinder-section" aria-labelledby="focus-running-title">
          <div class="cinder-section__header">
            <div class="cinder-section__heading">
              <h2 id="focus-running-title" class="cinder-section__title">Running</h2>
            </div>
            <div class="cinder-section__actions">
              <a href="#" class="cinder-button" data-cinder-variant="ghost" data-cinder-size="sm"
                >See all</a
              >
            </div>
          </div>
          <div class="cinder-section__content">
            <div class="cinder-grouped-list">
              <ul class="cinder-grouped-list__group">
                <li class="cinder-grouped-list-item cinder-grouped-list-item--linked">
                  <div class="cinder-grouped-list-item__content">
                    <div class="cinder-grouped-list-item__text">
                      <div class="cinder-grouped-list-item__title">
                        <a class="cinder-grouped-list-item__link" href="#"
                          >Send the weekly digest</a
                        >
                      </div>
                    </div>
                    <span class="cinder-grouped-list-item__chevron" aria-hidden="true"
                      ><svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="16"
                        height="16"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      >
                        <path d="m9 18 6-6-6-6" /></svg
                    ></span>
                  </div>
                </li>
              </ul>
            </div>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
